<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Razem w drodze</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9f9f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .naglowek {
            padding: 20px 24px 12px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .naglowek h1 { font-size: 26px; font-weight: 700; color: #111; }
        .naglowek p { font-size: 15px; color: #aaa; margin-top: 4px; font-weight: 500; }

        .lista {
            flex: 1;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .karta {
            background: white;
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }

        .karta-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .avatar-jan { background: #89AC76; }
        .avatar-agata { background: #9B3A4A; }
        .avatar-ty { background: #222; }

        .karta-info { flex: 1; }
        .karta-imie { font-size: 18px; font-weight: 700; color: #111; }
        .karta-trasa { font-size: 13px; color: #aaa; margin-top: 3px; font-weight: 500; }

        .karta-km { font-size: 24px; font-weight: 700; color: #111; text-align: right; }
        .karta-km span { font-size: 14px; font-weight: 500; color: #aaa; }

        .pasek-wrapper { display: flex; align-items: center; gap: 10px; }

        .pasek {
            flex: 1; height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .pasek-fill { height: 100%; border-radius: 4px; }
        .fill-jan { background: #89AC76; }
        .fill-agata { background: #9B3A4A; }
        .fill-ty { background: #222; }

        .pasek-label { font-size: 13px; font-weight: 600; color: #aaa; width: 44px; text-align: right; }

        .ty-karta { border: 2px solid #111; }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            padding-bottom: max(36px, env(safe-area-inset-bottom, 36px));
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 76px; height: 76px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.aktywny { background: #89AC76; }
        .nav-btn svg { width: 36px; height: 36px; }

        .nav-btn svg path, .nav-btn svg polyline,
        .nav-btn svg circle, .nav-btn svg line {
            stroke: #333; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path, .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle, .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="naglowek">
        <h1>Razem w drodze</h1>
        <p>Przebyte trasy</p>
    </div>

    <div class="lista">
        <div class="karta">
            <div class="karta-top">
                <div class="avatar avatar-jan">J</div>
                <div class="karta-info">
                    <div class="karta-imie">Jan</div>
                    <div class="karta-trasa">Rynek → Park Szczytniki</div>
                </div>
                <div class="karta-km">2,2 <span>km</span></div>
            </div>
            <div class="pasek-wrapper">
                <div class="pasek">
                    <div class="pasek-fill fill-jan" style="width:100%"></div>
                </div>
                <div class="pasek-label">2,2 km</div>
            </div>
        </div>

        <div class="karta">
            <div class="karta-top">
                <div class="avatar avatar-agata">A</div>
                <div class="karta-info">
                    <div class="karta-imie">Agata</div>
                    <div class="karta-trasa">Hala Stulecia → Pergola</div>
                </div>
                <div class="karta-km">1,5 <span>km</span></div>
            </div>
            <div class="pasek-wrapper">
                <div class="pasek">
                    <div class="pasek-fill fill-agata" style="width:68%"></div>
                </div>
                <div class="pasek-label">1,5 km</div>
            </div>
        </div>

        <div class="karta ty-karta">
            <div class="karta-top">
                <div class="avatar avatar-ty" id="avatar-ty">Ty</div>
                <div class="karta-info">
                    <div class="karta-imie" id="twoje-imie">Ty</div>
                    <div class="karta-trasa" id="twoja-trasa">Brak tras – czas wyjść!</div>
                </div>
                <div class="karta-km" id="twoje-km">0,0 <span>km</span></div>
            </div>
            <div class="pasek-wrapper">
                <div class="pasek">
                    <div class="pasek-fill fill-ty" id="twoj-pasek" style="width:0%"></div>
                </div>
                <div class="pasek-label" id="twoj-label">0 km</div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
        </a>
        <a href="leaderboard.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24"><polyline points="18 20 18 10"/><polyline points="12 20 12 4"/><polyline points="6 20 6 14"/></svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </a>
    </nav>

    <script>
        const profil = JSON.parse(localStorage.getItem('profil') || '{}');
        const wyniki = JSON.parse(localStorage.getItem('wyniki') || '[]');

        const avatarTy = document.getElementById('avatar-ty');
        if (profil.zdjecie) avatarTy.innerHTML = `<img src="${profil.zdjecie}" alt="avatar">`;
        if (profil.imie) document.getElementById('twoje-imie').textContent = `${profil.imie} ${profil.nazwisko || ''}`.trim();

        if (wyniki.length > 0) {
            const ostatni = wyniki[0];
            const lacznyKm = wyniki.reduce((s, w) => s + parseFloat(w.dystans), 0);
            document.getElementById('twoja-trasa').textContent = `${ostatni.nazwa || 'Własna trasa'} · ${ostatni.dystans} km`;
            document.getElementById('twoje-km').innerHTML = `${lacznyKm.toFixed(1)} <span>km</span>`;
            const procent = Math.min(100, (lacznyKm / 2.2) * 100);
            document.getElementById('twoj-pasek').style.width = procent + '%';
            document.getElementById('twoj-label').textContent = lacznyKm.toFixed(1) + ' km';
        }
    </script>
</body>
</html>
