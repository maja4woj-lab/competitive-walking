<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razem w drodze</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9f9f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .naglowek {
            padding: 24px 28px 24px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }

        .naglowek h1 {
            font-size: 26px;
            font-weight: 700;
            color: #111;
        }

        .naglowek p {
            font-size: 14px;
            color: #aaa;
            margin-top: 4px;
            font-weight: 500;
        }

        .lista {
            flex: 1;
            padding: 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .karta {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }

        .karta-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .avatar-jan { background: #2d6a2d; }
        .avatar-agata { background: #7B1F1F; }
        .avatar-ty { background: #222; }

        .karta-info { flex: 1; }

        .karta-imie {
            font-size: 17px;
            font-weight: 700;
            color: #111;
        }

        .karta-trasa {
            font-size: 13px;
            color: #aaa;
            margin-top: 2px;
            font-weight: 500;
        }

        .karta-km {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            text-align: right;
        }

        .karta-km span {
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
        }

        .pasek-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pasek {
            flex: 1;
            height: 6px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .pasek-fill { height: 100%; border-radius: 4px; }
        .fill-jan { background: #2d6a2d; }
        .fill-agata { background: #7B1F1F; }
        .fill-ty { background: #222; }

        .pasek-label {
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            width: 40px;
            text-align: right;
        }

        .ty-karta { border: 2px solid #111; }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px; height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path, .nav-btn svg polyline,
        .nav-btn svg circle, .nav-btn svg line {
            stroke: #333; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path, .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle, .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="naglowek">
        <h1>Razem w drodze</h1>
        <p>Przebyte trasy</p>
    </div>

    <div class="lista">
        <div class="karta">
            <div class="karta-top">
                <div class="avatar avatar-jan">J</div>
                <div class="karta-info">
                    <div class="karta-imie">Jan</div>
                    <div class="karta-trasa">Ostatnia trasa: Rynek → Park Szczytniki</div>
                </div>
                <div class="karta-km">2,2 <span>km</span></div>
            </div>
            <div class="pasek-wrapper">
                <div class="pasek">
                    <div class="pasek-fill fill-jan" style="width: 100%"></div>
                </div>
                <div class="pasek-label">2,2 km</div>
            </div>
        </div>

        <div class="karta">
            <div class="karta-top">
                <div class="avatar avatar-agata">A</div>
                <div class="karta-info">
                    <div class="karta-imie">Agata</div>
                    <div class="karta-trasa">Ostatnia trasa: Hala Stulecia → Pergola</div>
                </div>
                <div class="karta-km">1,5 <span>km</span></div>
            </div>
            <div class="pasek-wrapper">
                <div class="pasek">
                    <div class="pasek-fill fill-agata" style="width: 68%"></div>
                </div>
                <div class="pasek-label">1,5 km</div>
            </div>
        </div>

        <div class="karta ty-karta">
            <div class="karta-top">
                <div class="avatar avatar-ty">Ty</div>
                <div class="karta-info">
                    <div class="karta-imie">Ty</div>
                    <div class="karta-trasa" id="twoja-trasa">Brak tras – czas wyjść! 🚶</div>
                </div>
                <div class="karta-km" id="twoje-km">0,0 <span>km</span></div>
            </div>
            <div class="pasek-wrapper">
                <div class="pasek">
                    <div class="pasek-fill fill-ty" id="twoj-pasek" style="width: 0%"></div>
                </div>
                <div class="pasek-label" id="twoj-label">0 km</div>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
        </a>
        <a href="leaderboard.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24"><polyline points="18 20 18 10"/><polyline points="12 20 12 4"/><polyline points="6 20 6 14"/></svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </a>
    </nav>

    <script>
        const wyniki = JSON.parse(localStorage.getItem('wyniki') || '[]');

        if (wyniki.length > 0) {
            const ostatni = wyniki[0];
            const lacznyKm = wyniki.reduce((s, w) => s + parseFloat(w.dystans), 0);

            document.getElementById('twoja-trasa').textContent =
                `Ostatnia trasa: ${ostatni.nazwa || 'Własna trasa'} · ${ostatni.dystans} km`;
            document.getElementById('twoje-km').innerHTML =
                `${lacznyKm.toFixed(1)} <span>km</span>`;

            const procent = Math.min(100, (lacznyKm / 2.2) * 100);
            document.getElementById('twoj-pasek').style.width = procent + '%';
            document.getElementById('twoj-label').textContent = lacznyKm.toFixed(1) + ' km';
        }
    </script>
</body>
</html>
