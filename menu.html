<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 20px 24px;
            gap: 4px;
            overflow: hidden;
        }

        .logo-img {
            width: 60%;
            max-width: 240px;
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 0px;
            padding-left: 2px;
        }

        .mapa-wrapper {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .mapa-svg {
            position: absolute;
            bottom: 0;
            left: -20px;
            width: 115%;
            height: auto;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 12px 0 8px;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <div class="mapa-wrapper">
            <svg class="mapa-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Zielone plamy -->
                <ellipse cx="60" cy="260" rx="70" ry="50" fill="#c8d9b0" opacity="0.7"/>
                <ellipse cx="340" cy="280" rx="65" ry="45" fill="#c8d9b0" opacity="0.7"/>
                <ellipse cx="210" cy="290" rx="50" ry="30" fill="#c8d9b0" opacity="0.6"/>
                <ellipse cx="150" cy="230" rx="35" ry="25" fill="#c8d9b0" opacity="0.5"/>
                <ellipse cx="310" cy="180" rx="40" ry="28" fill="#c8d9b0" opacity="0.5"/>

                <!-- Drogi szare -->
                <path d="M 0 180 Q 100 170 200 185 Q 300 200 400 180"
                    fill="none" stroke="#d8d8d8" stroke-width="14" stroke-linecap="round"/>
                <path d="M 220 0 Q 215 90 220 190 Q 225 250 220 300"
                    fill="none" stroke="#d8d8d8" stroke-width="11" stroke-linecap="round"/>
                <path d="M 0 90 Q 90 115 155 150 Q 215 185 275 225 Q 330 260 400 275"
                    fill="none" stroke="#d8d8d8" stroke-width="9" stroke-linecap="round"/>
                <path d="M 90 0 Q 100 70 110 140 Q 120 190 130 240"
                    fill="none" stroke="#e0e0e0" stroke-width="7" stroke-linecap="round"/>

                <!-- Trasa – zaczyna się od lewej góry (przy logo) -->
                <path d="M 20 10 Q 50 40 70 80 Q 90 120 130 150 Q 170 180 220 190 Q 270 200 310 180 Q 350 160 370 190"
                    fill="none" stroke="#aaa" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Start – przy logo, zielony -->
                <circle cx="20" cy="10" r="8" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="20" cy="10" r="4" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="70" cy="80" r="6" fill="#7B1F1F"/>
                <circle cx="130" cy="150" r="6" fill="#2d6a2d"/>
                <circle cx="220" cy="190" r="6" fill="#7B1F1F"/>
                <circle cx="310" cy="180" r="6" fill="#2d6a2d"/>

                <!-- Koniec – bordowy -->
                <circle cx="370" cy="190" r="8" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="370" cy="190" r="4" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
