<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 28px;
            gap: 12px;
        }

        .logo-img {
            width: 65%;
            max-width: 240px;
        }

        .tagline {
            font-size: 16px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.5px;
        }

        .mapa-wrapper {
            width: 100%;
            margin-top: 8px;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <div class="mapa-wrapper">
            <svg width="100%" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">

                <!-- 3 organiczne zielone kształty -->
                <ellipse cx="70" cy="110" rx="62" ry="48"
                    fill="#c8d9b0" opacity="0.75" transform="rotate(-15 70 110)"/>
                <ellipse cx="180" cy="130" rx="58" ry="44"
                    fill="#c8d9b0" opacity="0.7" transform="rotate(8 180 130)"/>
                <ellipse cx="270" cy="105" rx="52" ry="42"
                    fill="#c8d9b0" opacity="0.72" transform="rotate(-8 270 105)"/>

                <!-- Szara ścieżka wokół kształtów -->
                <path d="M 10 60 C 30 30 60 20 95 35 C 125 48 140 75 165 80 C 190 85 215 65 245 60 C 270 56 300 70 315 90 C 320 110 310 140 285 150 C 260 160 230 155 200 160 C 170 165 145 170 115 165 C 85 160 55 148 35 132 C 15 118 5 90 10 60"
                    fill="none" stroke="#d0d0d0" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Kropki startowe i końcowe -->
                <circle cx="10" cy="60" r="7" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="10" cy="60" r="3.5" fill="#2d6a2d"/>

                <circle cx="165" cy="80" r="6" fill="#7B1F1F"/>
                <circle cx="285" cy="150" r="6" fill="#2d6a2d"/>

                <circle cx="115" cy="165" r="7" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="115" cy="165" r="3.5" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
