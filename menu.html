<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: sans-serif;
            background: #f0f4f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
        }

        .logo-sekcja {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .logo { font-size: 56px; margin-bottom: 12px; }

        h1 { font-size: 32px; color: #2d5a27; font-weight: 700; }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 360px;
            flex: 1;
            justify-content: center;
            padding: 40px 0;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px 24px;
            background: white;
            border: none;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            text-decoration: none;
            color: #222;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .btn:active { transform: translateY(0px); }

        .btn-icon { font-size: 32px; width: 44px; text-align: center; }

        .btn-text { display: flex; flex-direction: column; text-align: left; }

        .btn-desc {
            font-size: 13px;
            color: #888;
            font-weight: 400;
            margin-top: 3px;
        }

        .btn-primary { border-left: 5px solid #4CAF50; }
        .btn-secondary { border-left: 5px solid #2196F3; }
        .btn-tertiary { border-left: 5px solid #FF9800; }

        .wersja {
            font-size: 12px;
            color: #ccc;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="logo-sekcja">
        <div class="logo">🚶</div>
        <h1>Blink</h1>
    </div>

    <div class="menu">
        <a href="index.html" class="btn btn-primary">
            <span class="btn-icon">🗺️</span>
            <span class="btn-text">
                Wybór trasy
                <span class="btn-desc">Zaplanuj gdzie chcesz iść</span>
            </span>
        </a>

        <a href="leaderboard.html" class="btn btn-secondary">
            <span class="btn-icon">🏆</span>
            <span class="btn-text">
                Rywalizacja
                <span class="btn-desc">Porównaj wyniki ze znajomymi</span>
            </span>
        </a>

        <a href="profile.html" class="btn btn-tertiary">
            <span class="btn-icon">👤</span>
            <span class="btn-text">
                Profil
                <span class="btn-desc">Twoje trasy i osiągnięcia</span>
            </span>
        </a>
    </div>

    <div class="wersja">Blink v1.0</div>
</body>
</html>
