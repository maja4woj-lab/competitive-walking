<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 8px;
            position: relative;
        }

        .logo-img {
            width: 55%;
            max-width: 220px;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .mapa-container {
            width: 100%;
            max-width: 380px;
            height: 260px;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 12px 0 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <svg class="mapa-container" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="60" cy="200" rx="55" ry="40" fill="#c8d9b0" opacity="0.7"/>
            <ellipse cx="320" cy="220" rx="50" ry="35" fill="#c8d9b0" opacity="0.7"/>
            <ellipse cx="200" cy="240" rx="40" ry="25" fill="#c8d9b0" opacity="0.6"/>
            <ellipse cx="140" cy="180" rx="30" ry="22" fill="#c8d9b0" opacity="0.5"/>
            <ellipse cx="300" cy="140" rx="35" ry="25" fill="#c8d9b0" opacity="0.5"/>

            <path d="M 0 150 Q 80 145 160 155 Q 240 165 380 150"
                fill="none" stroke="#d0d0d0" stroke-width="12" stroke-linecap="round"/>
            <path d="M 200 0 Q 195 80 200 160 Q 205 220 200 260"
                fill="none" stroke="#d0d0d0" stroke-width="10" stroke-linecap="round"/>
            <path d="M 0 80 Q 80 100 140 130 Q 200 160 260 200 Q 310 230 380 240"
                fill="none" stroke="#d0d0d0" stroke-width="8" stroke-linecap="round"/>
            <path d="M 80 0 Q 90 60 100 120 Q 110 160 120 200"
                fill="none" stroke="#d8d8d8" stroke-width="6" stroke-linecap="round"/>

            <path d="M 50 220 Q 90 190 130 160 Q 170 130 210 110 Q 250 90 290 100 Q 330 110 340 140"
                fill="none" stroke="#aaa" stroke-width="3.5" stroke-linecap="round"/>

            <circle cx="50" cy="220" r="8" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
            <circle cx="50" cy="220" r="4" fill="#2d6a2d"/>
            <circle cx="130" cy="160" r="6" fill="#7B1F1F"/>
            <circle cx="210" cy="110" r="6" fill="#2d6a2d"/>
            <circle cx="290" cy="100" r="6" fill="#7B1F1F"/>
            <circle cx="340" cy="140" r="8" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
            <circle cx="340" cy="140" r="4" fill="#7B1F1F"/>
        </svg>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
