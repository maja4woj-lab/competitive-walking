<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        .lewa {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 0 28px 28px;
            gap: 14px;
            flex-shrink: 0;
            width: 52%;
        }

        .logo-img {
            width: 100%;
            max-width: 220px;
        }

        .tagline {
            font-size: 16px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .prawa {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .mapa-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="lewa">
            <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
            <div class="tagline">w Twoim kierunku</div>
        </div>

        <div class="prawa">
            <svg class="mapa-svg" viewBox="0 0 200 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

                <!-- Zielone plamy na dole -->
                <ellipse cx="50" cy="400" rx="80" ry="60" fill="#c8d9b0" opacity="0.7" transform="rotate(-15 50 400)"/>
                <ellipse cx="160" cy="440" rx="70" ry="55" fill="#c8d9b0" opacity="0.65" transform="rotate(10 160 440)"/>
                <ellipse cx="100" cy="480" rx="60" ry="35" fill="#c8d9b0" opacity="0.6"/>
                <ellipse cx="30" cy="340" rx="45" ry="35" fill="#c8d9b0" opacity="0.5" transform="rotate(20 30 340)"/>
                <ellipse cx="180" cy="350" rx="40" ry="30" fill="#c8d9b0" opacity="0.5"/>

                <!-- Drogi zaokrąglone -->
                <path d="M 0 280 C 50 272 100 278 150 274 C 175 272 195 276 210 273"
                    fill="none" stroke="#e0e0e0" stroke-width="16" stroke-linecap="round"/>
                <path d="M 80 0 C 78 80 82 160 80 260 C 78 330 80 400 80 500"
                    fill="none" stroke="#e0e0e0" stroke-width="13" stroke-linecap="round"/>
                <path d="M 0 180 C 40 195 70 220 95 255 C 120 290 130 330 135 380 C 138 410 140 450 142 490"
                    fill="none" stroke="#e0e0e0" stroke-width="10" stroke-linecap="round"/>
                <path d="M 150 100 C 148 160 152 220 155 290 C 158 350 155 420 155 490"
                    fill="none" stroke="#e2e2e2" stroke-width="8" stroke-linecap="round"/>

                <!-- Trasa – zaczyna się od góry lewej (pod logo) -->
                <path d="M 30 30 C 40 80 50 130 65 175 C 80 220 100 255 115 300 C 130 345 140 385 148 430"
                    fill="none" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>

                <!-- Start zielony -->
                <circle cx="30" cy="30" r="9" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="30" cy="30" r="4.5" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="65" cy="175" r="7" fill="#7B1F1F"/>
                <circle cx="115" cy="300" r="7" fill="#2d6a2d"/>
                <circle cx="138" cy="390" r="7" fill="#7B1F1F"/>

                <!-- Koniec bordowy -->
                <circle cx="148" cy="430" r="9" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="148" cy="430" r="4.5" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
