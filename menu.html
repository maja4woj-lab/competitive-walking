<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 0 28px 32px;
            gap: 12px;
        }
        .logo-img { width: 65%; max-width: 240px; }
        .tagline {
            font-size: 16px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.5px;
        }
        .mapa-wrapper { width: 100%; margin-top: 8px; }
        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }
        .nav-btn svg path, .nav-btn svg polyline,
        .nav-btn svg circle, .nav-btn svg line {
            stroke: #333; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .nav-btn.aktywny svg path, .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle, .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <div class="mapa-wrapper">
            <svg width="100%" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">

                <!-- Ścieżka rysowana PRZED kółkami -->
                <path d="M 195 8 C 230 8 265 15 280 35 C 295 55 285 85 270 105 C 255 125 230 130 210 148 C 190 165 185 180 170 192 C 150 192 130 192 112 185 C 92 175 80 158 65 148 C 45 135 22 132 18 115 C 14 98 28 82 45 75 C 62 68 82 72 100 68 C 120 63 138 52 158 45 C 172 40 185 25 195 8"
                    fill="none" stroke="#c8c8c8" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Kółka rysowane PO ścieżce -->
                <ellipse cx="38" cy="55" rx="32" ry="26"
                    fill="#c8d9b0" opacity="0.75" transform="rotate(-20 38 55)"/>
                <ellipse cx="75" cy="145" rx="58" ry="44"
                    fill="#c8d9b0" opacity="0.7" transform="rotate(12 75 145)"/>
                <ellipse cx="185" cy="130" rx="42" ry="34"
                    fill="#c8d9b0" opacity="0.72" transform="rotate(-8 185 130)"/>
                <ellipse cx="215" cy="55" rx="28" ry="22"
                    fill="#c8d9b0" opacity="0.65" transform="rotate(15 215 55)"/>
                <ellipse cx="282" cy="148" rx="38" ry="40"
                    fill="#c8d9b0" opacity="0.68" transform="rotate(-5 282 148)"/>

                <!-- Start – czarna kropka przy napisie -->
                <circle cx="195" cy="8" r="8" fill="#222"/>

                <!-- Kropki pośrednie -->
                <circle cx="158" cy="45" r="5.5" fill="#2d6a2d"/>
                <circle cx="65" cy="148" r="5.5" fill="#7B1F1F"/>
                <circle cx="112" cy="185" r="5.5" fill="#7B1F1F"/>

                <!-- Koniec – czarna kropka -->
                <circle cx="170" cy="192" r="8" fill="#222"/>

            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
