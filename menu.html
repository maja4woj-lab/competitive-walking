<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 40px 28px 0;
        }

        .logo-img {
            width: 70%;
            max-width: 280px;
        }

        .tagline {
            width: 70%;
            max-width: 280px;
            font-size: 14px;
            font-weight: 500;
            color: #888;
            letter-spacing: 1px;
            margin-top: 14px;
        }

        .mapa-wrapper {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
            margin-top: 16px;
        }

        .mapa-svg {
            position: absolute;
            bottom: 0;
            right: -20px;
            width: 110%;
            height: auto;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <div class="mapa-wrapper">
            <svg class="mapa-svg" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
                <!-- Zielone plamy -->
                <ellipse cx="60" cy="250" rx="70" ry="52"
                    fill="#c8d9b0" opacity="0.65" transform="rotate(-10 60 250)"/>
                <ellipse cx="180" cy="280" rx="60" ry="40"
                    fill="#c8d9b0" opacity="0.6" transform="rotate(8 180 280)"/>
                <ellipse cx="320" cy="260" rx="68" ry="48"
                    fill="#c8d9b0" opacity="0.65" transform="rotate(-5 320 260)"/>
                <ellipse cx="390" cy="200" rx="40" ry="30"
                    fill="#c8d9b0" opacity="0.5" transform="rotate(15 390 200)"/>

                <!-- Drogi -->
                <path d="M 0 170 C 80 162 160 170 240 165 C 300 161 360 168 400 163"
                    fill="none" stroke="#e0e0e0" stroke-width="14" stroke-linecap="round"/>
                <path d="M 160 0 C 158 70 162 140 160 200 C 158 245 160 280 160 320"
                    fill="none" stroke="#e0e0e0" stroke-width="11" stroke-linecap="round"/>
                <path d="M 0 90 C 60 108 110 135 160 162 C 210 188 265 220 320 255 C 360 278 390 295 400 305"
                    fill="none" stroke="#e0e0e0" stroke-width="9" stroke-linecap="round"/>
                <path d="M 260 0 C 258 55 262 110 260 165 C 258 210 260 260 260 320"
                    fill="none" stroke="#e2e2e2" stroke-width="7" stroke-linecap="round"/>

                <!-- Trasa – zaczyna się od lewej góry (od napisu) -->
                <path d="M 10 5 C 30 35 55 65 80 95 C 108 128 135 152 168 168 C 200 183 235 178 268 188 C 300 198 330 215 355 240"
                    fill="none" stroke="#bbb" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Start zielony -->
                <circle cx="10" cy="5" r="9" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="10" cy="5" r="4.5" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="80" cy="95" r="7" fill="#7B1F1F"/>
                <circle cx="168" cy="168" r="7" fill="#2d6a2d"/>
                <circle cx="268" cy="188" r="7" fill="#7B1F1F"/>

                <!-- Koniec bordowy -->
                <circle cx="355" cy="240" r="9" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="355" cy="240" r="4.5" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
