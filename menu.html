<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* LEWA KOLUMNA – logo + napis wyśrodkowane pionowo */
        .lewa {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 0 28px 28px;
            gap: 14px;
            flex-shrink: 0;
            width: 52%;
        }

        .logo-img {
            width: 100%;
            max-width: 220px;
        }

        .tagline {
            font-size: 16px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.5px;
            width: 100%;
        }

        /* PRAWA KOLUMNA – mapka wypełnia całą prawą stronę */
        .prawa {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .mapa-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <!-- LEWA – logo wyśrodkowane pionowo -->
        <div class="lewa">
            <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
            <div class="tagline">w Twoim kierunku</div>
        </div>

        <!-- PRAWA – mapka -->
        <div class="prawa">
            <svg class="mapa-svg" viewBox="0 0 200 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

                <!-- Zielone plamy -->
                <ellipse cx="100" cy="380" rx="90" ry="65"
                    fill="#c8d9b0" opacity="0.7" transform="rotate(-10 100 380)"/>
                <ellipse cx="160" cy="460" rx="70" ry="50"
                    fill="#c8d9b0" opacity="0.65"/>
                <ellipse cx="30" cy="430" rx="55" ry="40"
                    fill="#c8d9b0" opacity="0.6" transform="rotate(15 30 430)"/>
                <ellipse cx="150" cy="280" rx="45" ry="32"
                    fill="#c8d9b0" opacity="0.5"/>
                <ellipse cx="40" cy="300" rx="38" ry="28"
                    fill="#c8d9b0" opacity="0.45"/>

                <!-- Drogi -->
                <path d="M 0 250 C 60 242 120 250 200 245"
                    fill="none" stroke="#e0e0e0" stroke-width="14" stroke-linecap="round"/>
                <path d="M 100 0 C 98 100 102 200 100 320 C 98 400 100 460 100 500"
                    fill="none" stroke="#e0e0e0" stroke-width="11" stroke-linecap="round"/>
                <path d="M 0 150 C 50 168 90 200 120 240 C 150 278 165 320 170 380"
                    fill="none" stroke="#e0e0e0" stroke-width="8" stroke-linecap="round"/>

                <!-- Trasa – z góry w dół -->
                <path d="M 100 20 C 95 70 85 120 80 170 C 75 220 85 260 100 300 C 115 340 140 360 150 410"
                    fill="none" stroke="#bbb" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Start zielony -->
                <circle cx="100" cy="20" r="9" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="100" cy="20" r="4.5" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="80" cy="170" r="7" fill="#7B1F1F"/>
                <circle cx="100" cy="300" r="7" fill="#2d6a2d"/>
                <circle cx="140" cy="370" r="7" fill="#7B1F1F"/>

                <!-- Koniec bordowy -->
                <circle cx="150" cy="410" r="9" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="150" cy="410" r="4.5" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
