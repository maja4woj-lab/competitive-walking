<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 24px;
            gap: 12px;
        }

        .logo-img {
            width: 65%;
            max-width: 260px;
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            letter-spacing: 1px;
        }

        .mapa-wrapper {
            width: 100%;
            max-width: 340px;
            margin-top: 16px;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0 14px;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <div class="mapa-wrapper">
            <svg width="100%" viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Zielone plamy -->
                <ellipse cx="40" cy="170" rx="55" ry="38" fill="#c8d9b0" opacity="0.7"/>
                <ellipse cx="290" cy="180" rx="55" ry="38" fill="#c8d9b0" opacity="0.7"/>
                <ellipse cx="170" cy="185" rx="45" ry="28" fill="#c8d9b0" opacity="0.6"/>
                <ellipse cx="240" cy="120" rx="35" ry="22" fill="#c8d9b0" opacity="0.5"/>

                <!-- Drogi -->
                <path d="M 0 120 Q 90 112 170 118 Q 250 124 340 115"
                    fill="none" stroke="#d8d8d8" stroke-width="14" stroke-linecap="round"/>
                <path d="M 160 0 Q 158 70 160 130 Q 162 170 160 200"
                    fill="none" stroke="#d8d8d8" stroke-width="11" stroke-linecap="round"/>
                <path d="M 0 60 Q 80 80 130 105 Q 180 130 240 160 Q 290 182 340 190"
                    fill="none" stroke="#d8d8d8" stroke-width="8" stroke-linecap="round"/>

                <!-- Trasa -->
                <path d="M 30 20 Q 60 50 90 80 Q 120 110 160 125 Q 200 140 250 135 Q 300 130 325 155"
                    fill="none" stroke="#aaa" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Start zielony -->
                <circle cx="30" cy="20" r="8" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="30" cy="20" r="4" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="90" cy="80" r="6" fill="#7B1F1F"/>
                <circle cx="160" cy="125" r="6" fill="#2d6a2d"/>
                <circle cx="250" cy="135" r="6" fill="#7B1F1F"/>

                <!-- Koniec bordowy -->
                <circle cx="325" cy="155" r="8" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="325" cy="155" r="4" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
