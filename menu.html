<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 24px;
        }

        .logo-blok {
            width: 65%;
            max-width: 260px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-img {
            width: 100%;
        }

        .tagline {
            width: 100%;
            font-size: 13px;
            font-weight: 500;
            color: #888;
            letter-spacing: 1px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .tagline span {
            display: block;
            width: 100%;
            border-bottom: 1px solid #e8e8e8;
            padding-bottom: 10px;
        }

        .mapa-wrapper {
            width: 65%;
            max-width: 260px;
            margin-top: 20px;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0 14px;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-blok">
            <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
            <div class="tagline"><span>w Twoim kierunku</span></div>
        </div>

        <div class="mapa-wrapper">
            <svg width="100%" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">

                <!-- Zielone plamy organiczne jak na szkicu -->
                <ellipse cx="30" cy="175" rx="42" ry="35" fill="#c8d9b0" opacity="0.65"
                    transform="rotate(-15 30 175)"/>
                <ellipse cx="100" cy="190" rx="38" ry="28" fill="#c8d9b0" opacity="0.6"
                    transform="rotate(10 100 190)"/>
                <ellipse cx="185" cy="180" rx="45" ry="32" fill="#c8d9b0" opacity="0.65"
                    transform="rotate(-5 185 180)"/>
                <ellipse cx="240" cy="155" rx="32" ry="25" fill="#c8d9b0" opacity="0.55"
                    transform="rotate(20 240 155)"/>
                <ellipse cx="145" cy="210" rx="35" ry="20" fill="#c8d9b0" opacity="0.5"/>

                <!-- Drogi szare – subtelne -->
                <!-- Pozioma -->
                <path d="M 0 130 C 60 125 120 132 180 128 C 220 125 250 130 260 128"
                    fill="none" stroke="#e0e0e0" stroke-width="10" stroke-linecap="round"/>
                <!-- Ukośna lewa -->
                <path d="M 0 80 C 40 95 70 115 95 135 C 120 155 140 175 155 200"
                    fill="none" stroke="#e0e0e0" stroke-width="8" stroke-linecap="round"/>
                <!-- Pionowa prawa -->
                <path d="M 190 0 C 188 50 192 100 190 150 C 188 180 190 200 190 220"
                    fill="none" stroke="#e0e0e0" stroke-width="7" stroke-linecap="round"/>
                <!-- Ukośna prawa -->
                <path d="M 130 0 C 135 40 138 80 145 120 C 152 155 160 180 165 210"
                    fill="none" stroke="#e2e2e2" stroke-width="6" stroke-linecap="round"/>

                <!-- TRASA – organiczna, z góry w dół i prawo -->
                <path d="M 25 18 C 35 45 50 70 68 92 C 86 114 108 128 138 138 C 165 147 195 142 222 155 C 238 163 248 175 252 190"
                    fill="none" stroke="#bbb" stroke-width="3" stroke-linecap="round"/>

                <!-- Start – zielony -->
                <circle cx="25" cy="18" r="7" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="25" cy="18" r="3.5" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="68" cy="92" r="5.5" fill="#7B1F1F"/>
                <circle cx="138" cy="138" r="5.5" fill="#2d6a2d"/>
                <circle cx="222" cy="155" r="5.5" fill="#7B1F1F"/>

                <!-- Koniec – bordowy -->
                <circle cx="252" cy="190" r="7" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="252" cy="190" r="3.5" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
