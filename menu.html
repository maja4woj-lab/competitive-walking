<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 32px 24px 0;
            overflow: hidden;
        }

        .logo-img {
            width: 60%;
            max-width: 240px;
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            letter-spacing: 1px;
            margin-top: 12px;
            margin-bottom: 0;
            padding-left: 2px;
        }

        .mapa-wrapper {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .mapa-svg {
            position: absolute;
            top: 0;
            left: -10px;
            width: 110%;
            height: 100%;
        }

        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0 14px;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">
        <div class="tagline">w Twoim kierunku</div>

        <div class="mapa-wrapper">
            <svg class="mapa-svg" viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

                <!-- Zielone plamy parków -->
                <ellipse cx="50" cy="320" rx="80" ry="60" fill="#c8d9b0" opacity="0.7"/>
                <ellipse cx="320" cy="350" rx="75" ry="55" fill="#c8d9b0" opacity="0.7"/>
                <ellipse cx="190" cy="370" rx="60" ry="40" fill="#c8d9b0" opacity="0.6"/>
                <ellipse cx="280" cy="220" rx="50" ry="35" fill="#c8d9b0" opacity="0.5"/>
                <ellipse cx="100" cy="250" rx="40" ry="30" fill="#c8d9b0" opacity="0.45"/>

                <!-- Drogi szare -->
                <path d="M 0 200 Q 100 190 200 205 Q 300 220 380 200"
                    fill="none" stroke="#d8d8d8" stroke-width="16" stroke-linecap="round"/>
                <path d="M 180 0 Q 175 100 180 210 Q 185 280 180 400"
                    fill="none" stroke="#d8d8d8" stroke-width="13" stroke-linecap="round"/>
                <path d="M 0 100 Q 90 130 150 170 Q 210 210 270 260 Q 320 300 380 320"
                    fill="none" stroke="#d8d8d8" stroke-width="10" stroke-linecap="round"/>
                <path d="M 80 0 Q 90 80 100 160 Q 110 220 120 300"
                    fill="none" stroke="#e0e0e0" stroke-width="8" stroke-linecap="round"/>

                <!-- Trasa – zaczyna się od góry (od napisu) i idzie w dół -->
                <path d="M 60 30 Q 80 80 100 130 Q 120 180 160 210 Q 200 240 250 250 Q 300 260 340 290"
                    fill="none" stroke="#aaa" stroke-width="4" stroke-linecap="round"/>

                <!-- Start – zielony, na górze przy napisie -->
                <circle cx="60" cy="30" r="9" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
                <circle cx="60" cy="30" r="4.5" fill="#2d6a2d"/>

                <!-- Kropki pośrednie -->
                <circle cx="100" cy="130" r="7" fill="#7B1F1F"/>
                <circle cx="160" cy="210" r="7" fill="#2d6a2d"/>
                <circle cx="250" cy="250" r="7" fill="#7B1F1F"/>

                <!-- Koniec – bordowy -->
                <circle cx="340" cy="290" r="9" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
                <circle cx="340" cy="290" r="4.5" fill="#7B1F1F"/>
            </svg>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
