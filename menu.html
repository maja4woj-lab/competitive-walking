<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 32px;
        }

        .logo-img {
            width: 60%;
            max-width: 240px;
        }

        /* Ilustracja trasy */
        .trasa-svg {
            width: 180px;
            height: 160px;
        }

        /* DOLNY PASEK */
        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 12px 0 24px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn.aktywny { background: #2d6a2d; }

        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path,
        .nav-btn svg polyline,
        .nav-btn svg circle,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <!-- LOGO -->
        <img src="logo_blink.png" alt="blink! blink!" class="logo-img">

        <!-- ILUSTRACJA TRASY -->
        <svg class="trasa-svg" viewBox="0 0 180 160" xmlns="http://www.w3.org/2000/svg">
            <!-- Linia trasy – jasny szary -->
            <path d="M 30 130 Q 50 110 60 90 Q 70 70 90 60 Q 110 50 130 65 Q 150 80 140 100 Q 130 115 110 120"
                fill="none" stroke="#ccc" stroke-width="3" stroke-linecap="round"/>

            <!-- Punkt startowy – zielony -->
            <circle cx="30" cy="130" r="7" fill="white" stroke="#2d6a2d" stroke-width="2.5"/>
            <circle cx="30" cy="130" r="3.5" fill="#2d6a2d"/>

            <!-- Kropki na trasie – bordowe i zielone -->
            <circle cx="90" cy="60" r="5" fill="#7B1F1F"/>
            <circle cx="130" cy="65" r="5" fill="#2d6a2d"/>
            <circle cx="60" cy="90" r="5" fill="#7B1F1F"/>

            <!-- Punkt końcowy – bordowy -->
            <circle cx="110" cy="120" r="7" fill="white" stroke="#7B1F1F" stroke-width="2.5"/>
            <circle cx="110" cy="120" r="3.5" fill="#7B1F1F"/>
        </svg>
    </div>

    <!-- DOLNY PASEK -->
    <nav class="nav-bar">
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
