<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* GÓRNA CZĘŚĆ – logo */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo-tekst {
            font-size: 52px;
            font-weight: 700;
            color: #111;
            line-height: 1.1;
            text-align: center;
            letter-spacing: -1px;
        }

        .logo-tekst span {
            color: #2d6a2d;
        }

        .logo-podtytul {
            font-size: 14px;
            color: #aaa;
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-ilustracja {
            margin-top: 40px;
            width: 200px;
            height: 200px;
            position: relative;
        }

        /* Prosta ilustracja trasy SVG */
        .trasa-svg {
            width: 100%;
            height: 100%;
        }

        /* DOLNY PASEK NAWIGACJI */
        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 12px 0 24px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }

        .nav-btn:hover { background: #f5f5f5; }

        .nav-btn.aktywny {
            background: #2d6a2d;
        }

        .nav-btn.aktywny svg path,
        .nav-btn.aktywny svg rect,
        .nav-btn.aktywny svg circle,
        .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg line {
            stroke: white;
        }

        .nav-btn svg {
            width: 28px;
            height: 28px;
        }

        .nav-btn svg path,
        .nav-btn svg rect,
        .nav-btn svg circle,
        .nav-btn svg polyline,
        .nav-btn svg line {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-tekst">
            blink<span>!</span><br>blink<span>!</span>
        </div>
        <div class="logo-podtytul">by Maja Wojciechowska</div>

        <!-- Ilustracja trasy -->
        <div class="logo-ilustracja">
            <svg class="trasa-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Trasa -->
                <path d="M 40 160 Q 60 140 80 120 Q 100 100 90 80 Q 80 60 100 50 Q 120 40 140 60 Q 160 80 150 100 Q 140 120 120 130"
                    fill="none" stroke="#2d6a2d" stroke-width="3" stroke-linecap="round"/>
                <!-- Kropki na trasie -->
                <circle cx="40" cy="160" r="6" fill="#2d6a2d"/>
                <circle cx="90" cy="80" r="5" fill="#8B1A1A"/>
                <circle cx="140" cy="60" r="5" fill="#2d6a2d"/>
                <circle cx="120" cy="130" r="6" fill="#8B1A1A"/>
                <!-- Punkt startowy -->
                <circle cx="40" cy="160" r="10" fill="none" stroke="#2d6a2d" stroke-width="2"/>
                <!-- Punkt końcowy -->
                <circle cx="120" cy="130" r="10" fill="none" stroke="#8B1A1A" stroke-width="2"/>
            </svg>
        </div>
    </div>

    <!-- DOLNY PASEK -->
    <nav class="nav-bar">
        <!-- Wybór trasy -->
        <a href="index.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24">
                <path d="M3 12h18M12 3l9 9-9 9"/>
            </svg>
        </a>

        <!-- Rywalizacja -->
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <polyline points="18 20 18 10"/>
                <polyline points="12 20 12 4"/>
                <polyline points="6 20 6 14"/>
            </svg>
        </a>

        <!-- Profil -->
        <a href="profile.html" class="nav-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </a>
    </nav>
</body>
</html>
