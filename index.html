<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybór trasy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: sans-serif;
            background: #f0f4f0;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 40px;
        }

        #btnPowrot {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #555;
            margin-bottom: 20px;
            display: block;
        }

        h1 { font-size: 22px; color: #2d5a27; margin-bottom: 4px; }

        .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }

        .opcje {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 32px;
        }

        .opcja {
            background: white;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            text-decoration: none;
            color: #222;
            transition: transform 0.1s;
            border: 2px solid transparent;
        }

        .opcja:hover { transform: translateY(-2px); }
        .opcja.aktywna { border-color: #4CAF50; }

        .opcja-icon { font-size: 32px; margin-bottom: 8px; }
        .opcja-nazwa { font-size: 15px; font-weight: 600; }
        .opcja-opis { font-size: 12px; color: #888; margin-top: 4px; }

        /* SEKCJA ZAPISANE TRASY */
        #sekcja-zapisane, #sekcja-nowa { display: none; }

        .sekcja-tytul {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .trasa-karta {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .trasa-karta-info .nazwa {
            font-size: 16px;
            font-weight: 600;
            color: #222;
        }

        .trasa-karta-info .meta {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        .btn-idz {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-usun {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin-left: 8px;
            color: #ccc;
        }

        .btn-usun:hover { color: #f44336; }

        .pusta-lista {
            text-align: center;
            color: #aaa;
            padding: 30px 0;
            font-size: 14px;
        }

        /* SEKCJA NOWA TRASA */
        .pole { margin-bottom: 12px; }

        .pole label {
            font-size: 12px;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }

        .pole input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

        .przystanki { margin-bottom: 12px; }

        .przystanek {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .przystanek input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

        .przystanek-litera {
            width: 28px;
            height: 28px;
            background: #4CAF50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .btn-dodaj-przystanek {
            width: 100%;
            padding: 10px;
            background: none;
            border: 1px dashed #4CAF50;
            border-radius: 12px;
            color: #4CAF50;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .pole-nazwa {
            background: #f9f9f9;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .pole-nazwa label {
            font-size: 12px;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }

        .pole-nazwa input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .btn-wyznacz {
            width: 100%;
            padding: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-wyznacz:hover { background: #45a049; }

        .divider {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin: 16px 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .btn-mapa {
            width: 100%;
            padding: 14px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 16px;
            font-size: 15px;
            cursor: pointer;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="btnPowrot" onclick="window.location.href='menu.html'">← Menu</button>

    <h1>🗺️ Wybór trasy</h1>
    <p class="subtitle">Jak chcesz dziś iść?</p>

    <!-- DWA PRZYCISKI GÓRNE -->
    <div class="opcje">
        <div class="opcja" id="opcja-zapisane" onclick="pokazSekcje('zapisane')">
            <div class="opcja-icon">📋</div>
            <div class="opcja-nazwa">Moje trasy</div>
            <div class="opcja-opis">Wybierz zapisaną trasę</div>
        </div>
        <div class="opcja" id="opcja-nowa" onclick="pokazSekcje('nowa')">
            <div class="opcja-icon">✏️</div>
            <div class="opcja-nazwa">Nowa trasa</div>
            <div class="opcja-opis">Stwórz własną trasę</div>
        </div>
    </div>

    <!-- SEKCJA: MOJE ZAPISANE TRASY -->
    <div id="sekcja-zapisane">
        <div class="sekcja-tytul">📋 Moje zapisane trasy</div>
        <div id="lista-zapisanych"></div>
    </div>

    <!-- SEKCJA: NOWA TRASA -->
    <div id="sekcja-nowa">
        <div class="sekcja-tytul">✏️ Stwórz nową trasę</div>

        <div class="pole-nazwa">
            <label>Nazwa trasy (opcjonalnie)</label>
            <input type="text" id="nazwa-trasy" placeholder="np. Trasa przez Łazienki">
        </div>

        <div class="pole">
            <label>📍 Skąd (adres startowy)</label>
            <input type="text" id="adres-start" placeholder="np. Plac Defilad 1, Warszawa">
        </div>

        <div class="przystanki" id="przystanki"></div>

        <button class="btn-dodaj-przystanek" onclick="dodajPrzystanek()">
            + Dodaj przystanek
        </button>

        <div class="pole">
            <label>🏁 Dokąd (adres końcowy)</label>
            <input type="text" id="adres-koniec" placeholder="np. Wilanów, Warszawa">
        </div>

        <button class="btn-wyznacz" onclick="wyznaczZAdresu()">
            🚶 Wyznacz trasę
        </button>

        <div class="divider">lub</div>

        <button class="btn-mapa" onclick="window.location.href='map.html'">
            🗺️ Kliknij cel na mapie
        </button>
    </div>

    <script>
        const API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjU4NzI0ZmI5ZjE0ZTQ5NTFiNzFiZWJiMGNjZTU0ZmVlIiwiaCI6Im11cm11cjY0In0=';
        let przystankiCount = 0;

        // Pokaż odpowiednią sekcję
        function pokazSekcje(nazwa) {
            document.getElementById('sekcja-zapisane').style.display = 'none';
            document.getElementById('sekcja-nowa').style.display = 'none';
            document.getElementById('opcja-zapisane').classList.remove('aktywna');
            document.getElementById('opcja-nowa').classList.remove('aktywna');

            document.getElementById(`sekcja-${nazwa}`).style.display = 'block';
            document.getElementById(`opcja-${nazwa}`).classList.add('aktywna');

            if (nazwa === 'zapisane') wczytajZapisane();
        }

        // Dodaj przystanek
        function dodajPrzystanek() {
            przystankiCount++;
            const litery = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const litera = litery[przystankiCount - 1];
            const div = document.createElement('div');
            div.className = 'przystanek';
            div.id = `przystanek-${przystankiCount}`;
            div.innerHTML = `
                <div class="przystanek-litera">${litera}</div>
                <input type="text" placeholder="Adres przystanku ${litera}">
                <button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#ccc;">✕</button>
            `;
            document.getElementById('przystanki').appendChild(div);
        }

        // Wyznacz trasę z adresu
        async function wyznaczZAdresu() {
            const start = document.getElementById('adres-start').value.trim();
            const koniec = document.getElementById('adres-koniec').value.trim();
            const nazwa = document.getElementById('nazwa-trasy').value.trim();

            if (!start || !koniec) {
                alert('Wpisz adres startowy i końcowy!');
                return;
            }

            // Zbierz przystanki
            const przystankiInputy = document.querySelectorAll('.przystanek input');
            const przystanki = Array.from(przystankiInputy)
                .map(i => i.value.trim())
                .filter(v => v);

            // Geokoduj wszystkie adresy
            const wszystkieAdresy = [start, ...przystanki, koniec];

            try {
                const wspolrzedne = await Promise.all(
                    wszystkieAdresy.map(adres => geokoduj(adres))
                );

                if (wspolrzedne.some(w => !w)) {
                    alert('Nie udało się znaleźć jednego z adresów. Sprawdź czy są poprawne.');
                    return;
                }

                // Zapisz dane i przejdź do mapy
                const dane = {
                    punkty: wspolrzedne,
                    nazwa: nazwa || `Trasa ${new Date().toLocaleDateString('pl-PL')}`,
                    adresy: wszystkieAdresy
                };

                localStorage.setItem('nowaTrasa', JSON.stringify(dane));
                window.location.href = 'map.html';

            } catch(err) {
                alert('Błąd – sprawdź połączenie internetowe.');
            }
        }

        // Geokodowanie adresu → współrzędne
        async function geokoduj(adres) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adres)}&limit=1`;
            const response = await fetch(url);
            const data = await response.json();
            if (data.length === 0) return null;
            return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }

        // Wczytaj zapisane trasy
        function wczytajZapisane() {
            const zapisane = JSON.parse(localStorage.getItem('zapisaneTrasy') || '[]');
            const lista = document.getElementById('lista-zapisanych');

            if (zapisane.length === 0) {
                lista.innerHTML = `<div class="pusta-lista">Brak zapisanych tras.<br>Stwórz pierwszą trasę! 🚶</div>`;
                return;
            }

            lista.innerHTML = '';
            zapisane.forEach((trasa, index) => {
                lista.innerHTML += `
                    <div class="trasa-karta">
                        <div class="trasa-karta-info">
                            <div class="nazwa">${trasa.nazwa}</div>
                            <div class="meta">📏 ${trasa.dystans} km · 📍 ${trasa.adresy[0]}</div>
                        </div>
                        <div style="display:flex;align-items:center;">
                            <button class="btn-idz" onclick="idzTrasa(${index})">Idź ▶</button>
                            <button class="btn-usun" onclick="usunTrase(${index})">🗑️</button>
                        </div>
                    </div>`;
            });
        }

        // Idź zapisaną trasą
        function idzTrasa(index) {
            const zapisane = JSON.parse(localStorage.getItem('zapisaneTrasy') || '[]');
            localStorage.setItem('nowaTrasa', JSON.stringify(zapisane[index]));
            window.location.href = 'map.html';
        }

        // Usuń zapisaną trasę
        function usunTrase(index) {
            if (!confirm('Usunąć tę trasę?')) return;
            const zapisane = JSON.parse(localStorage.getItem('zapisaneTrasy') || '[]');
            zapisane.splice(index, 1);
            localStorage.setItem('zapisaneTrasy', JSON.stringify(zapisane));
            wczytajZapisane();
        }
    </script>
</body>
</html>
