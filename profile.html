<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9f9f9;
            min-height: 105vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .profil-header {
            background: white;
            padding: 24px 28px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .avatar-container { position: relative; }

        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
            cursor: pointer;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .avatar-edit {
            position: absolute;
            bottom: 0; right: 0;
            background: #111;
            border-radius: 50%;
            width: 26px; height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .avatar-edit svg { width: 13px; height: 13px; }
        .avatar-edit svg path { stroke: white; stroke-width: 2; fill: none; stroke-linecap: round; }

        .profil-imie { font-size: 20px; font-weight: 700; color: #111; text-align: center; }
        .profil-miasto { font-size: 13px; color: #aaa; font-weight: 500; text-align: center; margin-top: -6px; }

        .btn-edytuj {
            background: none;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            color: #111;
        }

        .edycja-form {
            background: white;
            margin: 12px 20px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            display: none;
            flex-shrink: 0;
        }

        .edycja-form h3 { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 16px; }
        .pole { margin-bottom: 12px; }
        .pole label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; font-weight: 500; }
        .pole input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #eee; border-radius: 12px;
            font-size: 15px; font-family: 'Montserrat', sans-serif;
        }

        .btn-zapisz {
            width: 100%; padding: 14px;
            background: #111; color: white;
            border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer; margin-top: 8px;
        }

        .zakladki {
            display: flex;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .zakladka {
            flex: 1; padding: 14px;
            text-align: center;
            font-size: 14px; font-weight: 600;
            color: #aaa; cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: 'Montserrat', sans-serif;
            background: white;
            border-top: none; border-left: none; border-right: none;
        }

        .zakladka.aktywna { color: #111; border-bottom: 2px solid #89AC76; }

        .zakladka-content { display: none; }
        .zakladka-content.aktywna { display: block; }

        /* KALENDARZ */
        .kalendarz-wrapper { padding: 16px 20px; }

        .kalendarz-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .kalendarz-nav h2 { font-size: 15px; font-weight: 700; color: #111; }

        .btn-miesiac {
            background: none;
            border: 1.5px solid #eee;
            border-radius: 10px;
            width: 34px; height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dni-tygodnia {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px; margin-bottom: 6px;
        }

        .dzien-tyg { text-align: center; font-size: 11px; font-weight: 600; color: #aaa; padding: 3px 0; }

        .kalendarz-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

        .dzien {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 13px; font-weight: 500; color: #111;
        }

        .dzien.spacer { background: #89AC76; color: white; font-weight: 700; cursor: pointer; }
        .dzien.spacer:hover { background: #7a9d68; }
        .dzien.dzisiaj { border: 2px solid #111; }

        .legenda {
            display: flex; align-items: center;
            gap: 8px; margin-top: 12px;
            font-size: 12px; color: #aaa; font-weight: 500;
        }

        .legenda-kropka { width: 12px; height: 12px; border-radius: 50%; background: #89AC76; flex-shrink: 0; }

        /* MOJE MIEJSCA */
        .miejsca-wybor { padding: 24px 20px; display: flex; gap: 16px; }

        .btn-miejsca {
            flex: 1; aspect-ratio: 1;
            border-radius: 24px; border: none;
            display: flex; align-items: center;
            justify-content: center; cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-miejsca:hover { transform: scale(0.97); }
        .btn-miejsca-zielone { background: #89AC76; }
        .btn-miejsca-czerwone { background: #9B3A4A; }

        .btn-miejsca-kropka {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
        }

        .btn-powrot-miejsca {
            display: flex; align-items: center; gap: 12px;
            background: none; border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px; font-weight: 600;
            color: #aaa; cursor: pointer; padding: 20px 20px;
        }

        .miejsca-lista { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }

        .miejsce-karta {
            background: white; border-radius: 16px;
            padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            display: flex; align-items: center; gap: 14px; cursor: pointer;
        }

        .miejsce-karta:hover { background: #f9f9f9; }
        .miejsce-kropka { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
        .miejsce-info { flex: 1; }
        .miejsce-czas { font-size: 13px; font-weight: 600; color: #111; }
        .miejsce-trasa { font-size: 12px; color: #aaa; font-weight: 500; margin-top: 2px; }
        .miejsce-notatka { font-size: 12px; color: #555; margin-top: 4px; font-style: italic; }

        .pusty { text-align: center; color: #ccc; padding: 40px 20px; font-size: 14px; font-weight: 500; }

        /* MODALS */
        .modal-pelny {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000; background: white; flex-direction: column;
        }

        .modal-pelny.otwarty { display: flex; }

        .modal-naglowek {
            background: white; border-bottom: 1px solid #f0f0f0;
            padding: 48px 20px 16px;
            display: flex; align-items: center; gap: 16px; flex-shrink: 0;
        }

        .btn-cofnij { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; }

        .modal-naglowek h2 { font-size: 17px; font-weight: 700; color: #111; flex: 1; }

        .modal-mapa { flex: 1; min-height: 0; }

        .modal-info {
            padding: 16px 20px; background: white;
            border-top: 1px solid #f0f0f0; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 10px;
        }

        .modal-info-typ { font-size: 16px; font-weight: 700; color: #111; }
        .modal-info-tekst { font-size: 13px; color: #aaa; font-weight: 500; }

        .notatka-input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #eee; border-radius: 12px;
            font-size: 14px; font-family: 'Montserrat', sans-serif;
            outline: none; resize: none; height: 80px;
        }

        .notatka-input:focus { border-color: #89AC76; }

        .modal-przyciski { display: flex; gap: 10px; }

        .btn-zapisz-notatke {
            flex: 2; padding: 13px;
            background: #89AC76; color: white;
            border: none; border-radius: 12px;
            font-size: 14px; font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
        }

        .btn-usun-miejsce {
            flex: 1; padding: 13px;
            background: white; color: #9B3A4A;
            border: 2px solid #9B3A4A; border-radius: 12px;
            font-size: 14px; font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
        }

        /* NAV */
        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            padding-bottom: max(36px, env(safe-area-inset-bottom, 36px));
            flex-shrink: 0;
            margin-top: auto;
        }

        .nav-btn {
            display: flex; align-items: center; justify-content: center;
            width: 76px; height: 76px;
            border-radius: 50%; border: none;
            background: none; cursor: pointer; text-decoration: none;
        }

        .nav-btn.aktywny { background: #89AC76; }
        .nav-btn svg { width: 36px; height: 36px; }

        .nav-btn svg path, .nav-btn svg polyline,
        .nav-btn svg circle, .nav-btn svg line {
            stroke: #333; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path, .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle, .nav-btn.aktywny svg line {
            stroke: white;
        }
    </style>
</head>
<body>

    <div class="profil-header">
        <div class="avatar-container">
            <div class="avatar" id="avatar">
                <svg viewBox="0 0 24 24" width="40" height="40">
                    <circle cx="12" cy="8" r="4" stroke="#bbb" stroke-width="2" fill="none"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#bbb" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="avatar-edit" onclick="document.getElementById('inputZdjecie').click()">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <input type="file" id="inputZdjecie" accept="image/*" style="display:none" onchange="zmienZdjecie(event)">
        </div>
        <div class="profil-imie" id="profil-imie">Twój profil</div>
        <div class="profil-miasto" id="profil-miasto"></div>
        <button class="btn-edytuj" onclick="toggleEdycja()">Edytuj dane</button>
    </div>

    <div class="edycja-form" id="edycja-form">
        <h3>Edytuj profil</h3>
        <div class="pole"><label>Imię</label><input type="text" id="input-imie" placeholder="np. Anna"></div>
        <div class="pole"><label>Nazwisko</label><input type="text" id="input-nazwisko" placeholder="np. Kowalska"></div>
        <div class="pole"><label>Miasto</label><input type="text" id="input-miasto" placeholder="np. Wrocław"></div>
        <button class="btn-zapisz" onclick="zapiszProfil()">Zapisz</button>
    </div>

    <div class="zakladki">
        <button class="zakladka aktywna" onclick="pokazZakladke('aktywnosc', this)">Aktywność</button>
        <button class="zakladka" onclick="pokazZakladke('moje-miejsca', this)">Moje miejsca</button>
    </div>

    <div id="tab-aktywnosc" class="zakladka-content aktywna">
        <div class="kalendarz-wrapper">
            <div class="kalendarz-nav">
                <button class="btn-miesiac" onclick="poprzedniMiesiac()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="15 18 9 12 15 6" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </button>
                <h2 id="kalendarz-tytul"></h2>
                <button class="btn-miesiac" onclick="nastepnyMiesiac()">
                    <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="9 18 15 12 9 6" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="dni-tygodnia">
                <div class="dzien-tyg">Pn</div><div class="dzien-tyg">Wt</div>
                <div class="dzien-tyg">Śr</div><div class="dzien-tyg">Cz</div>
                <div class="dzien-tyg">Pt</div><div class="dzien-tyg">Sb</div>
                <div class="dzien-tyg">Nd</div>
            </div>
            <div class="kalendarz-grid" id="kalendarz-grid"></div>
            <div class="legenda">
                <div class="legenda-kropka"></div>
                <span>Dzień ze spacerem – kliknij żeby zobaczyć trasę</span>
            </div>
        </div>
    </div>

    <div id="tab-moje-miejsca" class="zakladka-content">
        <div id="widok-wybor">
            <div class="miejsca-wybor">
                <button class="btn-miejsca btn-miejsca-zielone" onclick="pokazListeMiejsc('tak')">
                    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
                        <div class="btn-miejsca-kropka"></div>
                        <span style="color:white;font-size:13px;font-weight:700;">Interesujące</span>
                    </div>
                </button>
                <button class="btn-miejsca btn-miejsca-czerwone" onclick="pokazListeMiejsc('nie')">
                    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
                        <div class="btn-miejsca-kropka"></div>
                        <span style="color:white;font-size:13px;font-weight:700;">Problematyczne</span>
                    </div>
                </button>
            </div>
        </div>
        <div id="widok-lista" style="display:none;">
            <button class="btn-powrot-miejsca" onclick="powrotDoWyboru()">
                <svg viewBox="0 0 24 24" width="48" height="48"><polygon points="15,4 5,12 15,20" fill="#ccc"/></svg>
                Wróć
            </button>
            <div class="miejsca-lista" id="miejsca-lista"></div>
        </div>
    </div>

    <!-- MODAL TRASY -->
    <div class="modal-pelny" id="modal-trasa">
        <div class="modal-naglowek">
            <button class="btn-cofnij" onclick="zamknijModalTrasy()">
                <svg viewBox="0 0 24 24" width="48" height="48"><polygon points="16,4 6,12 16,20" fill="#ccc"/></svg>
            </button>
            <h2 id="modal-trasa-tytul">Spacer</h2>
        </div>
        <div class="modal-mapa" id="modal-trasa-mapa"></div>
    </div>

    <!-- MODAL MIEJSCA -->
    <div class="modal-pelny" id="modal-miejsce">
        <div class="modal-naglowek">
            <button class="btn-cofnij" onclick="zamknijModalMiejsca()">
                <svg viewBox="0 0 24 24" width="48" height="48"><polygon points="16,4 6,12 16,20" fill="#ccc"/></svg>
            </button>
            <h2 id="modal-miejsce-tytul">Miejsce</h2>
        </div>
        <div class="modal-mapa" id="modal-miejsce-mapa"></div>
        <div class="modal-info">
            <div class="modal-info-typ" id="modal-miejsce-typ"></div>
            <div class="modal-info-tekst" id="modal-miejsce-tekst"></div>
            <textarea class="notatka-input" id="notatka-input" placeholder="Dodaj notatkę..."></textarea>
            <div class="modal-przyciski">
                <button class="btn-usun-miejsce" onclick="usunMiejsce()">Usuń</button>
                <button class="btn-zapisz-notatke" onclick="zapiszNotatke()">Zapisz notatkę</button>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><polyline points="18 20 18 10"/><polyline points="12 20 12 4"/><polyline points="6 20 6 14"/></svg>
        </a>
        <a href="profile.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const profil = JSON.parse(localStorage.getItem('profil') || '{}');
        let wyniki = JSON.parse(localStorage.getItem('wyniki') || '[]');
        let aktualnyRok = new Date().getFullYear();
        let aktualnyMiesiac = new Date().getMonth();
        let modalTrasMapa = null;
        let modalMiejsceMapa = null;
        let aktywnyWynikIdx = null;
        let aktywnyWpIdx = null;
        let aktywnyTyp = null;

        function pokazZakladke(nazwa, btn) {
            document.querySelectorAll('.zakladka').forEach(z => z.classList.remove('aktywna'));
            document.querySelectorAll('.zakladka-content').forEach(z => z.classList.remove('aktywna'));
            document.getElementById(`tab-${nazwa}`).classList.add('aktywna');
            btn.classList.add('aktywna');
            if (nazwa === 'aktywnosc') renderujKalendarz();
            if (nazwa === 'moje-miejsca') {
                document.getElementById('widok-wybor').style.display = 'block';
                document.getElementById('widok-lista').style.display = 'none';
            }
        }

        function wczytajProfil() {
            if (profil.imie) document.getElementById('profil-imie').textContent = `${profil.imie} ${profil.nazwisko || ''}`.trim();
            if (profil.miasto) document.getElementById('profil-miasto').textContent = profil.miasto;
            if (profil.zdjecie) document.getElementById('avatar').innerHTML = `<img src="${profil.zdjecie}" alt="avatar">`;
            if (profil.imie) document.getElementById('input-imie').value = profil.imie;
            if (profil.nazwisko) document.getElementById('input-nazwisko').value = profil.nazwisko;
            if (profil.miasto) document.getElementById('input-miasto').value = profil.miasto;
        }

        function toggleEdycja() {
            const form = document.getElementById('edycja-form');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        function zapiszProfil() {
            profil.imie = document.getElementById('input-imie').value;
            profil.nazwisko = document.getElementById('input-nazwisko').value;
            profil.miasto = document.getElementById('input-miasto').value;
            localStorage.setItem('profil', JSON.stringify(profil));
            wczytajProfil();
            toggleEdycja();
        }

        function zmienZdjecie(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                profil.zdjecie = e.target.result;
                localStorage.setItem('profil', JSON.stringify(profil));
                document.getElementById('avatar').innerHTML = `<img src="${e.target.result}" alt="avatar">`;
            };
            reader.readAsDataURL(file);
        }

        function renderujKalendarz() {
            const nazwyMiesiecy = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
            document.getElementById('kalendarz-tytul').textContent = `${nazwyMiesiecy[aktualnyMiesiac]} ${aktualnyRok}`;

            const dniDoWynikow = {};
            wyniki.forEach((w, idx) => {
                if (w.data) {
                    const czesci = w.data.split('.');
                    if (czesci.length === 3) {
                        const d = parseInt(czesci[0]), m = parseInt(czesci[1]) - 1, r = parseInt(czesci[2]);
                        if (m === aktualnyMiesiac && r === aktualnyRok) {
                            if (!dniDoWynikow[d]) dniDoWynikow[d] = [];
                            dniDoWynikow[d].push(idx);
                        }
                    }
                }
            });

            const pierwszyDzien = new Date(aktualnyRok, aktualnyMiesiac, 1);
            const ostatniDzien = new Date(aktualnyRok, aktualnyMiesiac + 1, 0);
            const dzisiaj = new Date();
            let poczatekTygodnia = pierwszyDzien.getDay();
            if (poczatekTygodnia === 0) poczatekTygodnia = 7;

            const grid = document.getElementById('kalendarz-grid');
            grid.innerHTML = '';
            for (let i = 1; i < poczatekTygodnia; i++) grid.appendChild(document.createElement('div'));
            for (let d = 1; d <= ostatniDzien.getDate(); d++) {
                const el = document.createElement('div');
                el.className = 'dzien';
                el.textContent = d;
                const czyDzisiaj = d === dzisiaj.getDate() && aktualnyMiesiac === dzisiaj.getMonth() && aktualnyRok === dzisiaj.getFullYear();
                if (dniDoWynikow[d]) {
                    el.classList.add('spacer');
                    el.onclick = () => otworzModalTrasy(dniDoWynikow[d][0]);
                } else if (czyDzisiaj) {
                    el.classList.add('dzisiaj');
                }
                grid.appendChild(el);
            }
        }

        function poprzedniMiesiac() {
            aktualnyMiesiac--;
            if (aktualnyMiesiac < 0) { aktualnyMiesiac = 11; aktualnyRok--; }
            renderujKalendarz();
        }

        function nastepnyMiesiac() {
            aktualnyMiesiac++;
            if (aktualnyMiesiac > 11) { aktualnyMiesiac = 0; aktualnyRok++; }
            renderujKalendarz();
        }

        function pokazListeMiejsc(typ) {
            aktywnyTyp = typ;
            document.getElementById('widok-wybor').style.display = 'none';
            document.getElementById('widok-lista').style.display = 'block';
            const lista = document.getElementById('miejsca-lista');
            lista.innerHTML = '';
            const miejsca = [];
            wyniki.forEach((wynik, wynikIdx) => {
                if (wynik.waypointy) {
                    wynik.waypointy.forEach((wp, wpIdx) => {
                        if (wp.typ === typ) miejsca.push({ wynik, wynikIdx, wp, wpIdx });
                    });
                }
            });
            if (miejsca.length === 0) {
                lista.innerHTML = `<div class="pusty">Brak ${typ === 'tak' ? 'interesujących' : 'problematycznych'} miejsc</div>`;
                return;
            }
            miejsca.forEach(({ wynik, wynikIdx, wp, wpIdx }) => {
                const div = document.createElement('div');
                div.className = 'miejsce-karta';
                div.onclick = () => otworzModalMiejsca(wynikIdx, wpIdx);
                div.innerHTML = `
                    <div class="miejsce-kropka" style="background: ${typ === 'tak' ? '#89AC76' : '#9B3A4A'}"></div>
                    <div class="miejsce-info">
                        <div class="miejsce-czas">${wynik.data} · ${wp.czas}</div>
                        <div class="miejsce-trasa">${wynik.nazwa || 'Trasa własna'}</div>
                        ${wp.notatka ? `<div class="miejsce-notatka">"${wp.notatka}"</div>` : ''}
                    </div>
                    <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="8,4 18,12 8,20" fill="#ddd"/></svg>
                `;
                lista.appendChild(div);
            });
        }

        function powrotDoWyboru() {
            document.getElementById('widok-wybor').style.display = 'block';
            document.getElementById('widok-lista').style.display = 'none';
        }

        function otworzModalTrasy(index) {
            const wynik = wyniki[index];
            if (!wynik || !wynik.trasa || wynik.trasa.length < 2) return;
            document.getElementById('modal-trasa-tytul').textContent = `${wynik.nazwa || 'Spacer'} · ${wynik.dystans} km`;
            document.getElementById('modal-trasa').classList.add('otwarty');
            if (modalTrasMapa) { modalTrasMapa.remove(); modalTrasMapa = null; }
            setTimeout(() => {
                modalTrasMapa = L.map('modal-trasa-mapa');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalTrasMapa);
                const linia = L.polyline(wynik.trasa, { color: '#89AC76', weight: 5 }).addTo(modalTrasMapa);
                modalTrasMapa.fitBounds(linia.getBounds(), { padding: [40, 40] });
                L.circleMarker(wynik.trasa[0], { radius: 10, fillColor: '#111', color: 'white', weight: 2, fillOpacity: 1 }).addTo(modalTrasMapa);
                L.circleMarker(wynik.trasa[wynik.trasa.length-1], { radius: 10, fillColor: '#9B3A4A', color: 'white', weight: 2, fillOpacity: 1 }).addTo(modalTrasMapa);
                if (wynik.waypointy) {
                    wynik.waypointy.forEach(wp => {
                        L.circleMarker([wp.pozycja.lat, wp.pozycja.lng], {
                            radius: 8, fillColor: wp.typ === 'tak' ? '#89AC76' : '#9B3A4A',
                            color: 'white', weight: 2, fillOpacity: 0.9
                        }).addTo(modalTrasMapa);
                    });
                }
            }, 100);
        }

        function zamknijModalTrasy() {
            document.getElementById('modal-trasa').classList.remove('otwarty');
            if (modalTrasMapa) { modalTrasMapa.remove(); modalTrasMapa = null; }
        }

        function otworzModalMiejsca(wynikIdx, wpIdx) {
            const wynik = wyniki[wynikIdx];
            const wp = wynik.waypointy[wpIdx];
            aktywnyWynikIdx = wynikIdx;
            aktywnyWpIdx = wpIdx;

            document.getElementById('modal-miejsce-tytul').textContent =
                wp.typ === 'tak' ? 'Miejsce interesujące' : 'Miejsce problematyczne';
            document.getElementById('modal-miejsce-typ').textContent =
                `${wynik.nazwa || 'Trasa własna'} · ${wynik.data}`;
            document.getElementById('modal-miejsce-tekst').textContent = wynik.data + ' · ' + wp.czas;
            document.getElementById('notatka-input').value = wp.notatka || '';

            document.getElementById('modal-miejsce').classList.add('otwarty');
            if (modalMiejsceMapa) { modalMiejsceMapa.remove(); modalMiejsceMapa = null; }
            setTimeout(() => {
                modalMiejsceMapa = L.map('modal-miejsce-mapa');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMiejsceMapa);
                const latlng = L.latLng(wp.pozycja.lat, wp.pozycja.lng);
                if (wynik.trasa && wynik.trasa.length > 1) {
                    L.polyline(wynik.trasa, { color: '#ddd', weight: 4 }).addTo(modalMiejsceMapa);
                }
                L.circleMarker(latlng, {
                    radius: 14, fillColor: wp.typ === 'tak' ? '#89AC76' : '#9B3A4A',
                    color: 'white', weight: 3, fillOpacity: 1
                }).addTo(modalMiejsceMapa);
                modalMiejsceMapa.setView(latlng, 17);
            }, 100);
        }

        function zamknijModalMiejsca() {
            document.getElementById('modal-miejsce').classList.remove('otwarty');
            if (modalMiejsceMapa) { modalMiejsceMapa.remove(); modalMiejsceMapa = null; }
        }

        function zapiszNotatke() {
            if (aktywnyWynikIdx === null || aktywnyWpIdx === null) return;
            const tekst = document.getElementById('notatka-input').value.trim();
            wyniki[aktywnyWynikIdx].waypointy[aktywnyWpIdx].notatka = tekst;
            localStorage.setItem('wyniki', JSON.stringify(wyniki));
            zamknijModalMiejsca();
            pokazListeMiejsc(aktywnyTyp);
        }

        function usunMiejsce() {
            if (aktywnyWynikIdx === null || aktywnyWpIdx === null) return;
            if (!confirm('Usunąć to miejsce?')) return;
            wyniki[aktywnyWynikIdx].waypointy.splice(aktywnyWpIdx, 1);
            localStorage.setItem('wyniki', JSON.stringify(wyniki));
            zamknijModalMiejsca();
            pokazListeMiejsc(aktywnyTyp);
        }

        wczytajProfil();
        renderujKalendarz();
    </script>
</body>
</html>
