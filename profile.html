<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9f9f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* NAGŁÓWEK */
        .profil-header {
            background: white;
            padding: 36px 28px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .avatar-container { position: relative; }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
            cursor: pointer;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .avatar-edit {
            position: absolute;
            bottom: 0; right: 0;
            background: #111;
            border-radius: 50%;
            width: 26px; height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .profil-imie {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            text-align: center;
        }

        .profil-miasto {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
            text-align: center;
            margin-top: -8px;
        }

        .btn-edytuj {
            background: none;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            color: #111;
        }

        /* FORMULARZ */
        .edycja-form {
            background: white;
            margin: 12px 20px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            display: none;
            flex-shrink: 0;
        }

        .edycja-form h3 {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            margin-bottom: 16px;
        }

        .pole { margin-bottom: 12px; }

        .pole label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .pole input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-zapisz {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
        }

        /* ZAKŁADKI */
        .zakladki {
            display: flex;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .zakladka {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-family: 'Montserrat', sans-serif;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .zakladka.aktywna {
            color: #111;
            border-bottom: 2px solid #111;
        }

        .zakladka-content { display: none; flex: 1; overflow-y: auto; }
        .zakladka-content.aktywna { display: block; }

        /* KALENDARZ */
        .kalendarz-wrapper { padding: 16px 20px; }

        .kalendarz-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .kalendarz-nav h2 {
            font-size: 15px;
            font-weight: 700;
            color: #111;
        }

        .btn-miesiac {
            background: none;
            border: 1.5px solid #eee;
            border-radius: 10px;
            width: 34px; height: 34px;
            font-size: 16px;
            cursor: pointer;
        }

        .dni-tygodnia {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            margin-bottom: 6px;
        }

        .dzien-tyg {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            padding: 3px 0;
        }

        .kalendarz-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .dzien {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 500;
            color: #111;
        }

        .dzien.spacer {
            background: #2d6a2d;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .dzien.spacer:hover { background: #245520; }
        .dzien.dzisiaj { border: 2px solid #111; }

        .legenda {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 12px;
            color: #aaa;
            font-weight: 500;
        }

        .legenda-kropka {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #2d6a2d;
        }

        /* MOJE MIEJSCA */
        .miejsca-lista { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

        .miejsce-karta {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .miejsce-karta:hover { background: #f9f9f9; }

        .miejsce-kropka {
            width: 20px; height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .miejsce-info { flex: 1; }

        .miejsce-typ {
            font-size: 14px;
            font-weight: 700;
            color: #111;
        }

        .miejsce-czas {
            font-size: 12px;
            color: #aaa;
            font-weight: 500;
            margin-top: 2px;
        }

        .miejsce-trasa {
            font-size: 12px;
            color: #aaa;
            font-weight: 500;
        }

        .miejsce-notatka {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
            font-style: italic;
        }

        .pusty {
            text-align: center;
            color: #ccc;
            padding: 40px 20px;
            font-size: 14px;
            font-weight: 500;
        }

        /* MODAL TRASY */
        #modal-trasa {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000;
            background: white;
            flex-direction: column;
        }

        #modal-trasa.otwarty { display: flex; }

        .modal-naglowek {
            background: white;
            border-bottom: 1px solid #f0f0f0;
            padding: 48px 20px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .modal-naglowek button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #111;
        }

        .modal-naglowek h2 {
            font-size: 17px;
            font-weight: 700;
            color: #111;
        }

        #modal-trasa-mapa { flex: 1; }

        /* MODAL MIEJSCA */
        #modal-miejsce {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000;
            background: white;
            flex-direction: column;
        }

        #modal-miejsce.otwarty { display: flex; }
        #modal-miejsce-mapa { flex: 1; }

        .modal-info {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .modal-info-typ {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .modal-info-tekst {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
        }

        /* NAV */
        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 14px 0;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px; height: 56px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.aktywny { background: #2d6a2d; }
        .nav-btn svg { width: 26px; height: 26px; }

        .nav-btn svg path, .nav-btn svg polyline,
        .nav-btn svg circle, .nav-btn svg line {
            stroke: #333; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .nav-btn.aktywny svg path, .nav-btn.aktywny svg polyline,
        .nav-btn.aktywny svg circle, .nav-btn.aktywny svg line {
            stroke: white;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <!-- NAGŁÓWEK -->
    <div class="profil-header">
        <div class="avatar-container">
            <div class="avatar" id="avatar">🚶</div>
            <div class="avatar-edit" onclick="document.getElementById('inputZdjecie').click()">✏️</div>
            <input type="file" id="inputZdjecie" accept="image/*" style="display:none" onchange="zmienZdjecie(event)">
        </div>
        <div class="profil-imie" id="profil-imie">Twój profil</div>
        <div class="profil-miasto" id="profil-miasto"></div>
        <button class="btn-edytuj" onclick="toggleEdycja()">Edytuj dane</button>
    </div>

    <!-- FORMULARZ -->
    <div class="edycja-form" id="edycja-form">
        <h3>Edytuj profil</h3>
        <div class="pole">
            <label>Imię</label>
            <input type="text" id="input-imie" placeholder="np. Anna">
        </div>
        <div class="pole">
            <label>Nazwisko</label>
            <input type="text" id="input-nazwisko" placeholder="np. Kowalska">
        </div>
        <div class="pole">
            <label>Miasto</label>
            <input type="text" id="input-miasto" placeholder="np. Wrocław">
        </div>
        <button class="btn-zapisz" onclick="zapiszProfil()">Zapisz</button>
    </div>

    <!-- ZAKŁADKI -->
    <div class="zakladki">
        <button class="zakladka aktywna" onclick="pokazZakladke('aktywnosc', this)">Aktywność</button>
        <button class="zakladka" onclick="pokazZakladke('moje-miejsca', this)">Moje miejsca</button>
    </div>

    <div class="scroll-area">
        <!-- AKTYWNOŚĆ – KALENDARZ -->
        <div class="zakladka-content aktywna" id="tab-aktywnosc">
            <div class="kalendarz-wrapper">
                <div class="kalendarz-nav">
                    <button class="btn-miesiac" onclick="poprzedniMiesiac()">‹</button>
                    <h2 id="kalendarz-tytul"></h2>
                    <button class="btn-miesiac" onclick="nastepnyMiesiac()">›</button>
                </div>
                <div class="dni-tygodnia">
                    <div class="dzien-tyg">Pn</div>
                    <div class="dzien-tyg">Wt</div>
                    <div class="dzien-tyg">Śr</div>
                    <div class="dzien-tyg">Cz</div>
                    <div class="dzien-tyg">Pt</div>
                    <div class="dzien-tyg">Sb</div>
                    <div class="dzien-tyg">Nd</div>
                </div>
                <div class="kalendarz-grid" id="kalendarz-grid"></div>
                <div class="legenda">
                    <div class="legenda-kropka"></div>
                    <span>Dzień ze spacerem – kliknij żeby zobaczyć trasę</span>
                </div>
            </div>
        </div>

        <!-- MOJE MIEJSCA – KROPKI -->
        <div class="zakladka-content" id="tab-moje-miejsca">
            <div class="miejsca-lista" id="miejsca-lista"></div>
        </div>
    </div>

    <!-- MODAL TRASY (z kalendarza) -->
    <div id="modal-trasa">
        <div class="modal-naglowek">
            <button onclick="zamknijModalTrasy()">←</button>
            <h2 id="modal-trasa-tytul">Spacer</h2>
        </div>
        <div id="modal-trasa-mapa"></div>
    </div>

    <!-- MODAL MIEJSCA (z kropki) -->
    <div id="modal-miejsce">
        <div class="modal-naglowek">
            <button onclick="zamknijModalMiejsca()">←</button>
            <h2 id="modal-miejsce-tytul">Moje miejsce</h2>
        </div>
        <div id="modal-miejsce-mapa"></div>
        <div class="modal-info">
            <div class="modal-info-typ" id="modal-miejsce-typ"></div>
            <div class="modal-info-tekst" id="modal-miejsce-tekst"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
        </a>
        <a href="leaderboard.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><polyline points="18 20 18 10"/><polyline points="12 20 12 4"/><polyline points="6 20 6 14"/></svg>
        </a>
        <a href="profile.html" class="nav-btn aktywny">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </a>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const profil = JSON.parse(localStorage.getItem('profil') || '{}');
        let wyniki = JSON.parse(localStorage.getItem('wyniki') || '[]');
        let aktualnyRok = new Date().getFullYear();
        let aktualnyMiesiac = new Date().getMonth();
        let modalTrasMapa = null;
        let modalMiejsceMapa = null;

        function pokazZakladke(nazwa, btn) {
            document.querySelectorAll('.zakladka').forEach(z => z.classList.remove('aktywna'));
            document.querySelectorAll('.zakladka-content').forEach(z => z.classList.remove('aktywna'));
            document.getElementById(`tab-${nazwa}`).classList.add('aktywna');
            btn.classList.add('aktywna');
            if (nazwa === 'aktywnosc') renderujKalendarz();
            if (nazwa === 'moje-miejsca') wczytajMiejsca();
        }

        // PROFIL
        function wczytajProfil() {
            if (profil.imie) {
                document.getElementById('profil-imie').textContent =
                    `${profil.imie} ${profil.nazwisko || ''}`.trim();
            }
            if (profil.miasto) {
                document.getElementById('profil-miasto').textContent = `📍 ${profil.miasto}`;
            }
            if (profil.zdjecie) {
                document.getElementById('avatar').innerHTML =
                    `<img src="${profil.zdjecie}" alt="avatar">`;
            }
            if (profil.imie) document.getElementById('input-imie').value = profil.imie;
            if (profil.nazwisko) document.getElementById('input-nazwisko').value = profil.nazwisko;
            if (profil.miasto) document.getElementById('input-miasto').value = profil.miasto;
        }

        function toggleEdycja() {
            const form = document.getElementById('edycja-form');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        function zapiszProfil() {
            profil.imie = document.getElementById('input-imie').value;
            profil.nazwisko = document.getElementById('input-nazwisko').value;
            profil.miasto = document.getElementById('input-miasto').value;
            localStorage.setItem('profil', JSON.stringify(profil));
            wczytajProfil();
            toggleEdycja();
        }

        function zmienZdjecie(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                profil.zdjecie = e.target.result;
                localStorage.setItem('profil', JSON.stringify(profil));
                document.getElementById('avatar').innerHTML =
                    `<img src="${e.target.result}" alt="avatar">`;
            };
            reader.readAsDataURL(file);
        }

        // KALENDARZ
        function renderujKalendarz() {
            const nazwyMiesiecy = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];

            document.getElementById('kalendarz-tytul').textContent =
                `${nazwyMiesiecy[aktualnyMiesiac]} ${aktualnyRok}`;

            // Zbierz dni ze spacerami i przypisz wyniki
            const dniDoWynikow = {};
            wyniki.forEach((w, idx) => {
                if (w.data) {
                    const czesci = w.data.split('.');
                    if (czesci.length === 3) {
                        const d = parseInt(czesci[0]);
                        const m = parseInt(czesci[1]) - 1;
                        const r = parseInt(czesci[2]);
                        if (m === aktualnyMiesiac && r === aktualnyRok) {
                            if (!dniDoWynikow[d]) dniDoWynikow[d] = [];
                            dniDoWynikow[d].push(idx);
                        }
                    }
                }
            });

            const pierwszyDzien = new Date(aktualnyRok, aktualnyMiesiac, 1);
            const ostatniDzien = new Date(aktualnyRok, aktualnyMiesiac + 1, 0);
            const dzisiaj = new Date();

            let poczatekTygodnia = pierwszyDzien.getDay();
            if (poczatekTygodnia === 0) poczatekTygodnia = 7;

            const grid = document.getElementById('kalendarz-grid');
            grid.innerHTML = '';

            for (let i = 1; i < poczatekTygodnia; i++) {
                const el = document.createElement('div');
                grid.appendChild(el);
            }

            for (let d = 1; d <= ostatniDzien.getDate(); d++) {
                const el = document.createElement('div');
                el.className = 'dzien';
                el.textContent = d;

                const czyDzisiaj = d === dzisiaj.getDate() &&
                    aktualnyMiesiac === dzisiaj.getMonth() &&
                    aktualnyRok === dzisiaj.getFullYear();

                if (dniDoWynikow[d]) {
                    el.classList.add('spacer');
                    const indeksy = dniDoWynikow[d];
                    el.onclick = () => otworzModalTrasy(indeksy[0]);
                } else if (czyDzisiaj) {
                    el.classList.add('dzisiaj');
                }

                grid.appendChild(el);
            }
        }

        function poprzedniMiesiac() {
            aktualnyMiesiac--;
            if (aktualnyMiesiac < 0) { aktualnyMiesiac = 11; aktualnyRok--; }
            renderujKalendarz();
        }

        function nastepnyMiesiac() {
            aktualnyMiesiac++;
            if (aktualnyMiesiac > 11) { aktualnyMiesiac = 0; aktualnyRok++; }
            renderujKalendarz();
        }

        // MODAL TRASY
        function otworzModalTrasy(index) {
            const wynik = wyniki[index];
            if (!wynik || !wynik.trasa || wynik.trasa.length < 2) return;

            document.getElementById('modal-trasa-tytul').textContent =
                `${wynik.nazwa || 'Spacer'} · ${wynik.dystans} km`;
            document.getElementById('modal-trasa').classList.add('otwarty');

            if (modalTrasMapa) { modalTrasMapa.remove(); modalTrasMapa = null; }

            setTimeout(() => {
                modalTrasMapa = L.map('modal-trasa-mapa');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalTrasMapa);
                const linia = L.polyline(wynik.trasa, { color: '#2d6a2d', weight: 5 }).addTo(modalTrasMapa);
                modalTrasMapa.fitBounds(linia.getBounds(), { padding: [40, 40] });
                L.circleMarker(wynik.trasa[0], { radius: 10, fillColor: '#111', color: 'white', weight: 2, fillOpacity: 1 }).addTo(modalTrasMapa).bindPopup('Start');
                L.circleMarker(wynik.trasa[wynik.trasa.length-1], { radius: 10, fillColor: '#7B1F1F', color: 'white', weight: 2, fillOpacity: 1 }).addTo(modalTrasMapa).bindPopup('Koniec');
                if (wynik.waypointy) {
                    wynik.waypointy.forEach(wp => {
                        L.circleMarker([wp.pozycja.lat, wp.pozycja.lng], {
                            radius: 8, fillColor: wp.typ === 'tak' ? '#2d6a2d' : '#7B1F1F',
                            color: 'white', weight: 2, fillOpacity: 0.9
                        }).addTo(modalTrasMapa).bindPopup(`${wp.typ === 'tak' ? '✅' : '❌'} ${wp.czas}`);
                    });
                }
            }, 100);
        }

        function zamknijModalTrasy() {
            document.getElementById('modal-trasa').classList.remove('otwarty');
            if (modalTrasMapa) { modalTrasMapa.remove(); modalTrasMapa = null; }
        }

        // MOJE MIEJSCA
        function wczytajMiejsca() {
            const lista = document.getElementById('miejsca-lista');
            lista.innerHTML = '';

            const wszystkieMiejsca = [];
            wyniki.forEach((wynik, wynikIdx) => {
                if (wynik.waypointy) {
                    wynik.waypointy.forEach((wp, wpIdx) => {
                        wszystkieMiejsca.push({ wynik, wynikIdx, wp, wpIdx });
                    });
                }
            });

            if (wszystkieMiejsca.length === 0) {
                lista.innerHTML = `<div class="pusty">Brak miejsc – zaznacz TAK lub NIE podczas spaceru!</div>`;
                return;
            }

            wszystkieMiejsca.forEach(({ wynik, wynikIdx, wp, wpIdx }) => {
                const div = document.createElement('div');
                div.className = 'miejsce-karta';
                div.onclick = () => otworzModalMiejsca(wynikIdx, wpIdx);

                div.innerHTML = `
                    <div class="miejsce-kropka" style="background: ${wp.typ === 'tak' ? '#2d6a2d' : '#7B1F1F'}"></div>
                    <div class="miejsce-info">
                        <div class="miejsce-typ">${wp.typ === 'tak' ? '✅ TAK' : '❌ NIE'}</div>
                        <div class="miejsce-czas">📅 ${wynik.data} · ${wp.czas}</div>
                        <div class="miejsce-trasa">🗺️ ${wynik.nazwa || 'Trasa własna'}</div>
                        ${wp.notatka ? `<div class="miejsce-notatka">"${wp.notatka}"</div>` : ''}
                    </div>
                    <div style="color:#ddd;font-size:18px;">›</div>
                `;
                lista.appendChild(div);
            });
        }

        // MODAL MIEJSCA
        function otworzModalMiejsca(wynikIdx, wpIdx) {
            const wynik = wyniki[wynikIdx];
            const wp = wynik.waypointy[wpIdx];

            document.getElementById('modal-miejsce-tytul').textContent =
                wp.typ === 'tak' ? '✅ Miejsce TAK' : '❌ Miejsce NIE';
            document.getElementById('modal-miejsce-typ').textContent =
                `${wynik.nazwa || 'Trasa własna'} · ${wynik.data}`;
            document.getElementById('modal-miejsce-tekst').textContent =
                wp.notatka || 'Brak notatki';

            document.getElementById('modal-miejsce').classList.add('otwarty');

            if (modalMiejsceMapa) { modalMiejsceMapa.remove(); modalMiejsceMapa = null; }

            setTimeout(() => {
                modalMiejsceMapa = L.map('modal-miejsce-mapa');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMiejsceMapa);

                const latlng = L.latLng(wp.pozycja.lat, wp.pozycja.lng);

                // Pokaż trasę w tle jeśli jest
                if (wynik.trasa && wynik.trasa.length > 1) {
                    L.polyline(wynik.trasa, { color: '#ddd', weight: 4 }).addTo(modalMiejsceMapa);
                }

                // Pokaż punkt
                const marker = L.circleMarker(latlng, {
                    radius: 14,
                    fillColor: wp.typ === 'tak' ? '#2d6a2d' : '#7B1F1F',
                    color: 'white', weight: 3, fillOpacity: 1
                }).addTo(modalMiejsceMapa);

                modalMiejsceMapa.setView(latlng, 17);
            }, 100);
        }

        function zamknijModalMiejsca() {
            document.getElementById('modal-miejsce').classList.remove('otwarty');
            if (modalMiejsceMapa) { modalMiejsceMapa.remove(); modalMiejsceMapa = null; }
        }

        wczytajProfil();
        renderujKalendarz();
    </script>
</body>
</html>
