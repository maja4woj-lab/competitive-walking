<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaplanuj trasę</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }

        /* PANEL GÓRNY */
        #panel {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: white;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 12px 16px;
        }

        .panel-row1 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #btnPowrot {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 17px;
            color: #2d5a27;
            font-weight: 700;
            flex: 1;
        }

        /* PUNKTY TRASY */
        .punkty-trasy {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .punkt-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .punkt-ikona {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .ikona-start { background: #2196F3; }
        .ikona-przystanek { background: #FF9800; }
        .ikona-koniec { background: #f44336; }

        .punkt-input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .punkt-input:focus { border-color: #4CAF50; }

        .btn-usun-punkt {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #ccc;
            flex-shrink: 0;
        }

        .btn-usun-punkt:hover { color: #f44336; }

        /* PRZYCISKI AKCJI */
        .akcje {
            display: flex;
            gap: 8px;
        }

        .btn-przystanek {
            flex: 1;
            padding: 9px;
            background: none;
            border: 1px dashed #4CAF50;
            border-radius: 10px;
            color: #4CAF50;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-szukaj {
            flex: 2;
            padding: 9px;
            background: #4CAF50;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-szukaj:hover { background: #45a049; }

        /* WYNIKI WYSZUKIWANIA */
        #wyniki-wyszukiwania {
            position: absolute;
            left: 16px;
            right: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 1001;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .wynik-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .wynik-item:hover { background: #f9f9f9; }
        .wynik-item:last-child { border-bottom: none; }
        .wynik-nazwa { font-weight: 500; color: #222; }
        .wynik-adres { font-size: 12px; color: #888; margin-top: 2px; }

        /* PANEL DOLNY - pojawia się po wyznaczeniu trasy */
        #panel-dol {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 1000;
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
            padding: 20px 16px;
            display: none;
        }

        .trasa-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
        }

        .trasa-stat { text-align: center; }
        .trasa-stat .wartosc { font-size: 22px; font-weight: 700; color: #2d5a27; }
        .trasa-stat .label { font-size: 12px; color: #888; margin-top: 2px; }

        .nazwa-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .nazwa-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        .przyciski-dol {
            display: flex;
            gap: 10px;
        }

        .btn-zapisz {
            flex: 1;
            padding: 14px;
            background: white;
            border: 2px solid #4CAF50;
            border-radius: 14px;
            color: #4CAF50;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-nawiguj {
            flex: 2;
            padding: 14px;
            background: #4CAF50;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-nawiguj:hover { background: #45a049; }

        /* PRZYCISK MOJEJ LOKALIZACJI */
        #btnLokalizacja {
            position: absolute;
            bottom: 100px;
            right: 16px;
            z-index: 999;
            background: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- PANEL GÓRNY -->
    <div id="panel">
        <div class="panel-row1">
            <button id="btnPowrot" onclick="window.location.href='index.html'">←</button>
            <h1>🗺️ Zaplanuj trasę</h1>
        </div>

        <div class="punkty-trasy" id="punkty-trasy">
            <div class="punkt-row" id="row-start">
                <div class="punkt-ikona ikona-start">📍</div>
                <input class="punkt-input" id="input-start" type="text"
                    placeholder="Skąd? (adres lub Twoja lokalizacja)"
                    onfocus="aktywnyInput='start'"
                    oninput="szukajAdres(this.value, 'start')">
            </div>
            <div id="przystanki-container"></div>
            <div class="punkt-row" id="row-koniec">
                <div class="punkt-ikona ikona-koniec">🏁</div>
                <input class="punkt-input" id="input-koniec" type="text"
                    placeholder="Dokąd? (wpisz adres)"
                    onfocus="aktywnyInput='koniec'"
                    oninput="szukajAdres(this.value, 'koniec')">
            </div>
        </div>

        <div class="akcje">
            <button class="btn-przystanek" onclick="dodajPrzystanek()">+ Przystanek</button>
            <button class="btn-szukaj" onclick="wyznaczTrase()">🚶 Wyznacz trasę</button>
        </div>
    </div>

    <!-- WYNIKI WYSZUKIWANIA -->
    <div id="wyniki-wyszukiwania"></div>

    <!-- PANEL DOLNY -->
    <div id="panel-dol">
        <div class="trasa-info">
            <div class="trasa-stat">
                <div class="wartosc" id="info-dystans">—</div>
                <div class="label">km</div>
            </div>
            <div class="trasa-stat">
                <div class="wartosc" id="info-czas">—</div>
                <div class="label">minut</div>
            </div>
        </div>
        <div class="nazwa-row">
            <input type="text" id="input-nazwa" placeholder="💾 Nazwa trasy (opcjonalnie)">
        </div>
        <div class="przyciski-dol">
            <button class="btn-zapisz" onclick="zapiszTrase()">💾 Zapisz</button>
            <button class="btn-nawiguj" onclick="nawiguj()">🧭 Nawiguj teraz!</button>
        </div>
    </div>

    <button id="btnLokalizacja" onclick="idDoLokalizacji()">📍</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjU4NzI0ZmI5ZjE0ZTQ5NTFiNzFiZWJiMGNjZTU0ZmVlIiwiaCI6Im11cm11cjY0In0=';

        let mojaPozycja = null;
        let markerJa = null;
        let markery = [];
        let liniaTrasy = null;
        let aktywnyInput = null;
        let przystankiCount = 0;
        let aktualnaTrasa = null;
        let szukanieTimeout = null;

        // Mapa
        const map = L.map('map').setView([52.2297, 21.0122], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Lokalizacja
        map.locate({
    setView: true,
    maxZoom: 16,
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
});
        map.on('locationfound', function(e) {
            mojaPozycja = e.latlng;
            if (markerJa) map.removeLayer(markerJa);
            markerJa = L.circleMarker(e.latlng, {
                radius: 10, fillColor: '#2196F3',
                color: 'white', weight: 3, fillOpacity: 1
            }).addTo(map);

            // Wstaw "Moja lokalizacja" jako punkt startowy
            if (!document.getElementById('input-start').value) {
                document.getElementById('input-start').value = 'Moja lokalizacja';
                punkty['start'] = { lat: e.latlng.lat, lng: e.latlng.lng, nazwa: 'Moja lokalizacja' };
            }
        });

        // Kliknięcie na mapę = ustaw jako cel jeśli nie ma końca
        let popupKlikniecia = null;

map.on('click', function(e) {
    // Zamknij poprzedni popup
    if (popupKlikniecia) map.closePopup(popupKlikniecia);

    // Policz ile punktów już mamy
    const czyMamyKoniec = !!punkty['koniec'];

    const content = document.createElement('div');
    content.style.cssText = 'display:flex;flex-direction:column;gap:8px;min-width:160px;padding:4px;';

    // Przycisk - ustaw jako cel
    const btnCel = document.createElement('button');
    btnCel.textContent = '🏁 Ustaw jako cel';
    btnCel.style.cssText = 'padding:10px;background:#4CAF50;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;';
    btnCel.onclick = () => {
        punkty['koniec'] = { lat: e.latlng.lat, lng: e.latlng.lng, nazwa: 'Wybrany punkt' };
        document.getElementById('input-koniec').value = 'Wybrany punkt';
        postawMarker('koniec', e.latlng, '🏁');
        map.closePopup(popupKlikniecia);

        // Spróbuj zamienić na adres
        zamienNaAdres(e.latlng, 'koniec');
    };

    // Przycisk - dodaj jako przystanek
    const btnPrzystanek = document.createElement('button');
    btnPrzystanek.textContent = '🔶 Dodaj jako przystanek';
    btnPrzystanek.style.cssText = 'padding:10px;background:#FF9800;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;';
    btnPrzystanek.onclick = () => {
        przystankiCount++;
        const id = `przystanek-${przystankiCount}`;
        przystankiIds.push(id);
        const litery = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const litera = litery[przystankiIds.length - 1];

        punkty[id] = { lat: e.latlng.lat, lng: e.latlng.lng, nazwa: `Przystanek ${litera}` };
        postawMarker(id, e.latlng, '🔶');

        // Dodaj input do panelu
        const div = document.createElement('div');
        div.className = 'punkt-row';
        div.id = `row-${id}`;
        div.innerHTML = `
            <div class="punkt-ikona ikona-przystanek">${litera}</div>
            <input class="punkt-input" id="input-${id}" data-id="${id}"
                type="text" value="Przystanek ${litera}"
                onfocus="aktywnyInput='${id}'"
                oninput="szukajAdres(this.value, '${id}')">
            <button class="btn-usun-punkt" onclick="usunPrzystanek('${id}')">✕</button>
        `;
        document.getElementById('przystanki-container').appendChild(div);

        // Spróbuj zamienić na adres
        zamienNaAdres(e.latlng, id);
        map.closePopup(popupKlikniecia);
    };

    // Przycisk - ustaw jako start
    const btnStart = document.createElement('button');
    btnStart.textContent = '📍 Ustaw jako start';
    btnStart.style.cssText = 'padding:10px;background:#2196F3;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;';
    btnStart.onclick = () => {
        punkty['start'] = { lat: e.latlng.lat, lng: e.latlng.lng, nazwa: 'Wybrany start' };
        document.getElementById('input-start').value = 'Wybrany start';
        postawMarker('start', e.latlng, '📍');
        zamienNaAdres(e.latlng, 'start');
        map.closePopup(popupKlikniecia);
    };

    content.appendChild(btnCel);
    content.appendChild(btnPrzystanek);
    content.appendChild(btnStart);

    popupKlikniecia = L.popup({ closeButton: true })
        .setLatLng(e.latlng)
        .setContent(content)
        .openOn(map);
});

        // Słownik punktów
        let punkty = {};

        // Szukaj adresu z opóźnieniem
        function szukajAdres(wartosc, inputId) {
            clearTimeout(szukanieTimeout);
            if (wartosc.length < 3) {
                ukryjWyniki();
                return;
            }
            szukanieTimeout = setTimeout(() => geokodujISzukaj(wartosc, inputId), 400);
        }

        async function geokodujISzukaj(zapytanie, inputId) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(zapytanie)}&limit=4&countrycodes=pl`;
                const response = await fetch(url);
                const data = await response.json();
                pokazWyniki(data, inputId);
            } catch(err) {
                console.error(err);
            }
        }

        function pokazWyniki(wyniki, inputId) {
            const div = document.getElementById('wyniki-wyszukiwania');
            if (wyniki.length === 0) { ukryjWyniki(); return; }

            // Pozycja pod panelem
            const panel = document.getElementById('panel');
            div.style.top = (panel.offsetHeight + 8) + 'px';
            div.style.display = 'block';
            div.innerHTML = '';

            wyniki.forEach(w => {
                const item = document.createElement('div');
                item.className = 'wynik-item';
                const nazwa = w.display_name.split(',').slice(0, 3).join(',');
const adres = w.display_name.split(',').slice(3, 5).join(',');
                item.innerHTML = `<div class="wynik-nazwa">${nazwa}</div><div class="wynik-adres">${adres}</div>`;
                item.onclick = () => wybierzWynik(w, inputId);
                div.appendChild(item);
            });
        }

        function wybierzWynik(wynik, inputId) {
            const latlng = { lat: parseFloat(wynik.lat), lng: parseFloat(wynik.lon) };
            const nazwa = wynik.display_name.split(',')[0];

            punkty[inputId] = { ...latlng, nazwa: wynik.display_name };

            // Wpisz w input
            const input = document.getElementById(`input-${inputId}`) ||
                          document.querySelector(`[data-id="${inputId}"]`);
            if (input) input.value = nazwa;

            // Ikona
            const ikona = inputId === 'start' ? '📍' : inputId === 'koniec' ? '🏁' : '🔶';
            postawMarker(inputId, latlng, ikona);
            map.setView(latlng, 15);
            ukryjWyniki();
        }

        function postawMarker(id, latlng, ikona) {
            if (markery[id]) map.removeLayer(markery[id]);
            markery[id] = L.marker(latlng, {
                icon: L.divIcon({ html: ikona, iconSize: [30,30], className: '' })
            }).addTo(map);
        }

        function ukryjWyniki() {
            document.getElementById('wyniki-wyszukiwania').style.display = 'none';
        }

        // Kliknięcie poza wynikami = ukryj
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#wyniki-wyszukiwania') && !e.target.closest('.punkt-input')) {
                ukryjWyniki();
            }
        });

        // Dodaj przystanek
        let przystankiIds = [];
        function dodajPrzystanek() {
            przystankiCount++;
            const id = `przystanek-${przystankiCount}`;
            przystankiIds.push(id);
            const litery = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const litera = litery[przystankiCount - 1];

            const div = document.createElement('div');
            div.className = 'punkt-row';
            div.id = `row-${id}`;
            div.innerHTML = `
                <div class="punkt-ikona ikona-przystanek">${litera}</div>
                <input class="punkt-input" id="input-${id}" data-id="${id}"
                    type="text" placeholder="Przystanek ${litera}"
                    onfocus="aktywnyInput='${id}'"
                    oninput="szukajAdres(this.value, '${id}')">
                <button class="btn-usun-punkt" onclick="usunPrzystanek('${id}')">✕</button>
            `;

            document.getElementById('przystanki-container').appendChild(div);
        }

        function usunPrzystanek(id) {
            document.getElementById(`row-${id}`).remove();
            delete punkty[id];
            if (markery[id]) { map.removeLayer(markery[id]); delete markery[id]; }
            przystankiIds = przystankiIds.filter(i => i !== id);
        }

        // Wyznacz trasę
        async function wyznaczTrase() {
            if (!punkty['start'] && !mojaPozycja) {
                alert('Wpisz adres startowy!');
                return;
            }
            if (!punkty['koniec']) {
                alert('Wpisz adres końcowy!');
                return;
            }

            // Jeśli start = moja lokalizacja
            if (!punkty['start'] && mojaPozycja) {
                punkty['start'] = { lat: mojaPozycja.lat, lng: mojaPozycja.lng, nazwa: 'Moja lokalizacja' };
            }

            // Zbierz wszystkie punkty w kolejności
            const kolejnosc = ['start', ...przystankiIds, 'koniec'];
            const gotowePunkty = kolejnosc
                .filter(id => punkty[id])
                .map(id => punkty[id]);

            if (gotowePunkty.length < 2) {
                alert('Potrzebuję przynajmniej punkt startowy i końcowy!');
                return;
            }

            // Usuń starą trasę
            if (liniaTrasy) { map.removeLayer(liniaTrasy); liniaTrasy = null; }
            document.getElementById('panel-dol').style.display = 'none';

            try {
                let wspolrzedneTrasy = [];
                let calkowitaDystans = 0;
                let calkowityCzas = 0;

                for (let i = 0; i < gotowePunkty.length - 1; i++) {
                    const a = gotowePunkty[i];
                    const b = gotowePunkty[i + 1];
                    const url = `https://api.openrouteservice.org/v2/directions/foot-walking?api_key=${API_KEY}&start=${a.lng},${a.lat}&end=${b.lng},${b.lat}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    const odcinek = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    wspolrzedneTrasy = wspolrzedneTrasy.concat(odcinek);
                    calkowitaDystans += data.features[0].properties.summary.distance;
                    calkowityCzas += data.features[0].properties.summary.duration;
                }

                const dystans = (calkowitaDystans / 1000).toFixed(2);
                const czas = Math.round(calkowityCzas / 60);

                liniaTrasy = L.polyline(wspolrzedneTrasy, { color: '#4CAF50', weight: 5 }).addTo(map);
                map.fitBounds(liniaTrasy.getBounds(), { padding: [40, 160] });

                aktualnaTrasa = {
                    nazwa: '',
                    dystans: dystans,
                    punkty: gotowePunkty,
                    adresy: gotowePunkty.map(p => p.nazwa)
                };

                document.getElementById('info-dystans').textContent = dystans;
                document.getElementById('info-czas').textContent = czas;
                document.getElementById('panel-dol').style.display = 'block';

            } catch(err) {
                alert('Błąd wyznaczania trasy – sprawdź klucz API.');
                console.error(err);
            }
        }

        // Zapisz trasę
        function zapiszTrase() {
            if (!aktualnaTrasa) return;
            const nazwa = document.getElementById('input-nazwa').value.trim();
            aktualnaTrasa.nazwa = nazwa || `Trasa ${new Date().toLocaleDateString('pl-PL')}`;
            const zapisane = JSON.parse(localStorage.getItem('zapisaneTrasy') || '[]');
            zapisane.unshift(aktualnaTrasa);
            localStorage.setItem('zapisaneTrasy', JSON.stringify(zapisane));
            alert(`✅ Zapisano: "${aktualnaTrasa.nazwa}"!`);
        }

        // Nawiguj
        function nawiguj() {
            if (!aktualnaTrasa) return;
            const nazwa = document.getElementById('input-nazwa').value.trim();
            if (nazwa) aktualnaTrasa.nazwa = nazwa;
            localStorage.setItem('aktywnaTrasa', JSON.stringify(aktualnaTrasa));
            window.location.href = 'navigate.html';
        }

        function idDoLokalizacji() {
            if (mojaPozycja) map.setView(mojaPozycja, 16);
        }
        // Zamień współrzędne na czytelny adres
function zamienNaAdres(latlng, inputId) {
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
        .then(r => r.json())
        .then(data => {
            const adres = data.address;
            const ladnyAdres = [
                adres.road,
                adres.house_number,
                adres.city || adres.town || adres.village
            ].filter(Boolean).join(', ');

            if (ladnyAdres) {
                const input = document.getElementById(`input-${inputId}`) ||
                              document.querySelector(`[data-id="${inputId}"]`);
                if (input) input.value = ladnyAdres;
                if (punkty[inputId]) punkty[inputId].nazwa = ladnyAdres;
            }
        })
        .catch(() => {});
}
    </script>
</body>
</html>
