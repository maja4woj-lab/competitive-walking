<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawigacja</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f9f9f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #map {
            flex: 1;
            min-height: 0;
        }

        #btnPowrot {
            position: absolute;
            top: 48px;
            left: 16px;
            z-index: 1000;
            background: white;
            border: none;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #panel-dol {
            background: white;
            border-top: 1px solid #f0f0f0;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        #instrukcja-box {
            background: #f9f9f9;
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 4px solid #2d6a2d;
            font-size: 16px;
            font-weight: 600;
            color: #111;
        }

        .statystyki {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: #f9f9f9;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .stat-wartosc {
            font-size: 22px;
            font-weight: 700;
            color: #111;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
            font-weight: 500;
        }

        #dystans-pozostal {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
        }

        #btnStart {
            padding: 18px;
            background: #2d6a2d;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
        }

        #btnStart.stop { background: #c0392b; }

        #btnZakoncz {
            padding: 16px;
            background: #f9f9f9;
            color: #111;
            border: 2px solid #ddd;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            display: none;
        }

        #btnTest {
            padding: 14px;
            background: #f9f9f9;
            color: #555;
            border: 1.5px solid #ddd;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
        }

        /* BLE STATUS */
        .ble-pasek {
            display: flex;
            gap: 10px;
        }

        .btn-ble-duzy {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            color: white;
            background: #c0392b;
            transition: background 0.2s;
        }

        .btn-ble-duzy.polaczony { background: #2d6a2d; }
    </style>
</head>
<body>
    <div id="map"></div>

    <button id="btnPowrot" onclick="window.location.href='menu.html'">
        <svg viewBox="0 0 24 24" width="32" height="32">
            <polygon points="16,4 6,12 16,20" fill="#ccc"/>
        </svg>
    </button>

    <div id="panel-dol">
        <div id="instrukcja-box">⏳ Ładowanie...</div>

        <div class="statystyki">
            <div class="stat">
                <div class="stat-wartosc" id="czas">00:00</div>
                <div class="stat-label">Czas</div>
            </div>
            <div class="stat">
                <div class="stat-wartosc" id="predkosc">0.0</div>
                <div class="stat-label">km/h</div>
            </div>
            <div class="stat">
                <div class="stat-wartosc" id="dystans">0.0</div>
                <div class="stat-label">km</div>
            </div>
        </div>

        <div id="dystans-pozostal">—</div>

        <div class="ble-pasek">
            <button id="btn-lewa-nav" class="btn-ble-duzy" onclick="polaczBLEnav('LEFT')">lewy kierunkowskaz</button>
            <button id="btn-prawa-nav" class="btn-ble-duzy" onclick="polaczBLEnav('RIGHT')">prawy kierunkowskaz</button>
        </div>

        <button id="btnStart" onclick="toggleStart()">▶ Start</button>
        <button id="btnZakoncz" onclick="zakonczTrase()">🏁 Zakończ trasę</button>
        <button id="btnTest" onclick="testKierunkowskazow()">Test kierunkowskazów</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="bluetooth.js"></script>
    <script>
        const API_KEY = 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjU4NzI0ZmI5ZjE0ZTQ5NTFiNzFiZWJiMGNjZTU0ZmVlIiwiaCI6Im11cm11cjY0In0=';

        let mojaPozycja = null;
        let celPozycja = null;
        let markerJa = null;
        let liniaTrasy = null;
        let liniaUkonczona = null;
        let krokiPunkty = [];
        let startTime = null;
        let timerInterval = null;
        let dystansPrzebyta = 0;
        let ostatniaPozycja = null;
        let czyDziala = false;
        let waypointy = [];
        let trasaWspolrzedne = [];
        let ostatniCzasGPS = null;
        let ostatniaPozycjaGPS = null;
        let kierunkowskazAktywny = false;

        onButtonLeft  = () => dodajWaypoint('nie');
        onButtonRight = () => dodajWaypoint('tak');

        const map = L.map('map').setView([52.2297, 21.0122], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const aktywnaTrasa = JSON.parse(localStorage.getItem('aktywnaTrasa') || 'null');

        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true });

        map.on('locationfound', function(e) {
            mojaPozycja = e.latlng;
            if (markerJa) map.removeLayer(markerJa);
            markerJa = L.circleMarker(e.latlng, {
                radius: 10, fillColor: '#111',
                color: 'white', weight: 3, fillOpacity: 1
            }).addTo(map);

            if (aktywnaTrasa && aktywnaTrasa.punkty && !liniaTrasy) {
                rysujAktywnaTrase();
            } else if (!aktywnaTrasa) {
                document.getElementById('instrukcja-box').textContent = '📍 Kliknij cel na mapie';
            }
        });

        map.on('locationerror', function() {
            if (aktywnaTrasa && aktywnaTrasa.punkty && !liniaTrasy) {
                rysujAktywnaTrase();
            } else {
                document.getElementById('instrukcja-box').textContent = '📍 Kliknij cel na mapie';
            }
        });

        map.on('click', function(e) {
            if (czyDziala || aktywnaTrasa) return;
            celPozycja = e.latlng;
            L.circleMarker(e.latlng, {
                radius: 10, fillColor: '#7B1F1F',
                color: 'white', weight: 2, fillOpacity: 1
            }).addTo(map);
            pobierzTrase(mojaPozycja, celPozycja);
        });

        async function rysujAktywnaTrase() {
            if (!aktywnaTrasa || !aktywnaTrasa.punkty) return;
            document.getElementById('instrukcja-box').textContent = '⏳ Ładowanie trasy...';

            const punkty = aktywnaTrasa.punkty;
            celPozycja = L.latLng(
                punkty[punkty.length - 1].lat,
                punkty[punkty.length - 1].lng
            );

            try {
                let wspolrzedneTrasy = [];
                let wszystkieKroki = [];

                for (let i = 0; i < punkty.length - 1; i++) {
                    const url = `https://api.openrouteservice.org/v2/directions/foot-walking?api_key=${API_KEY}&start=${punkty[i].lng},${punkty[i].lat}&end=${punkty[i+1].lng},${punkty[i+1].lat}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    const odcinek = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    const offset = wspolrzedneTrasy.length;
                    wspolrzedneTrasy = wspolrzedneTrasy.concat(odcinek);
                    const kroki = data.features[0].properties.segments[0].steps.map(k => ({
                        ...k,
                        way_points: k.way_points ? [k.way_points[0] + offset, k.way_points[1] + offset] : k.way_points
                    }));
                    wszystkieKroki = wszystkieKroki.concat(kroki);
                }

                liniaTrasy = L.polyline(wspolrzedneTrasy, { color: '#2d6a2d', weight: 5 }).addTo(map);
                map.fitBounds(liniaTrasy.getBounds(), { padding: [40, 40] });

                L.circleMarker(celPozycja, {
                    radius: 10, fillColor: '#7B1F1F',
                    color: 'white', weight: 2, fillOpacity: 1
                }).addTo(map);

                przetworzKroki(wszystkieKroki, wspolrzedneTrasy);

                document.getElementById('instrukcja-box').textContent =
                    `${aktywnaTrasa.nazwa} · ${aktywnaTrasa.dystans} km`;
                document.getElementById('dystans-pozostal').textContent =
                    `Pozostało: ${aktywnaTrasa.dystans} km`;

            } catch(err) {
                document.getElementById('instrukcja-box').textContent = '❌ Błąd ładowania trasy';
            }
        }

        async function pobierzTrase(start, cel) {
            if (!start || !cel) return;
            document.getElementById('instrukcja-box').textContent = '⏳ Szukam trasy...';

            const url = `https://api.openrouteservice.org/v2/directions/foot-walking?api_key=${API_KEY}&start=${start.lng},${start.lat}&end=${cel.lng},${cel.lat}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                const wspolrzedne = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
                const dystans = (data.features[0].properties.summary.distance / 1000).toFixed(2);
                const czas = Math.round(data.features[0].properties.summary.duration / 60);
                const kroki = data.features[0].properties.segments[0].steps;

                liniaTrasy = L.polyline(wspolrzedne, { color: '#2d6a2d', weight: 5 }).addTo(map);
                map.fitBounds(liniaTrasy.getBounds(), { padding: [40, 40] });

                przetworzKroki(kroki, wspolrzedne);

                document.getElementById('instrukcja-box').textContent =
                    `Trasa gotowa! ${dystans} km · ok. ${czas} min`;

            } catch(err) {
                document.getElementById('instrukcja-box').textContent = '❌ Błąd trasy';
            }
        }

        function przetworzKroki(kroki, wspolrzedneTrasy) {
            krokiPunkty = [];
            kroki.forEach(krok => {
                const inst = krok.instruction.toLowerCase();
                if (inst.startsWith('head ') || inst.startsWith('depart') || inst.includes('arrive')) return;
                const idx = krok.way_points ? krok.way_points[1] : null;
                if (idx !== null && wspolrzedneTrasy[idx]) {
                    krokiPunkty.push({
                        latlng: L.latLng(wspolrzedneTrasy[idx][0], wspolrzedneTrasy[idx][1]),
                        instrukcja: krok.instruction
                    });
                }
            });
        }

        function toggleStart() {
            const btn = document.getElementById('btnStart');
            if (!czyDziala) {
                if (!celPozycja) {
                    alert('Najpierw wybierz trasę!');
                    return;
                }
                czyDziala = true;
                waypointy = [];
                trasaWspolrzedne = [];
                startTime = Date.now();
                dystansPrzebyta = 0;
                ostatniaPozycja = mojaPozycja;
                btn.textContent = '⏹ Stop';
                btn.classList.add('stop');
                document.getElementById('btnZakoncz').style.display = 'block';

                timerInterval = setInterval(aktualizujCzas, 1000);
                map.locate({ watch: true, maxZoom: 17, enableHighAccuracy: true });
                map.on('locationfound', aktualizujPozycje);
            } else {
                zatrzymaj();
            }
        }

        function aktualizujCzas() {
            const sekundy = Math.floor((Date.now() - startTime) / 1000);
            const mm = String(Math.floor(sekundy / 60)).padStart(2, '0');
            const ss = String(sekundy % 60).padStart(2, '0');
            document.getElementById('czas').textContent = `${mm}:${ss}`;
        }

        async function aktualizujKierunkowskazy(instrukcja) {
            if (!instrukcja || kierunkowskazAktywny) return;
            const txt = instrukcja.toLowerCase();
            kierunkowskazAktywny = true;

            if (txt.includes('left') || txt.includes('lewo') ||
                txt.includes('slight left') || txt.includes('sharp left')) {
                await kierunkowskazLewo(true);
                setTimeout(() => { kierunkowskazLewo(false); kierunkowskazAktywny = false; }, 4000);
            } else if (txt.includes('right') || txt.includes('prawo') ||
                       txt.includes('slight right') || txt.includes('sharp right')) {
                await kierunkowskazPrawo(true);
                setTimeout(() => { kierunkowskazPrawo(false); kierunkowskazAktywny = false; }, 4000);
            } else if (txt.includes('uturn') || txt.includes('u-turn') || txt.includes('zawróć')) {
                await kierunkowskazLewo(true);
                setTimeout(async () => {
                    await kierunkowskazLewo(false);
                    await kierunkowskazPrawo(true);
                    setTimeout(() => { kierunkowskazPrawo(false); kierunkowskazAktywny = false; }, 2000);
                }, 2000);
            } else {
                kierunkowskazAktywny = false;
            }
        }

        function aktualizujPozycje(e) {
            if (!czyDziala) return;
            const nowaPozycja = e.latlng;

            if (markerJa) map.removeLayer(markerJa);
            markerJa = L.circleMarker(nowaPozycja, {
                radius: 10, fillColor: '#111',
                color: 'white', weight: 3, fillOpacity: 1
            }).addTo(map);

            if (ostatniaPozycja) {
                if (liniaUkonczona) {
                    const pts = liniaUkonczona.getLatLngs();
                    pts.push(nowaPozycja);
                    liniaUkonczona.setLatLngs(pts);
                } else {
                    liniaUkonczona = L.polyline([ostatniaPozycja, nowaPozycja], {
                        color: '#aaa', weight: 5
                    }).addTo(map);
                }
                const delta = ostatniaPozycja.distanceTo(nowaPozycja);
                if (delta > 2) {
                    dystansPrzebyta += delta;
                    ostatniaPozycja = nowaPozycja;
                }
            } else {
                ostatniaPozycja = nowaPozycja;
            }

            map.setView(nowaPozycja);
            trasaWspolrzedne.push([nowaPozycja.lat, nowaPozycja.lng]);

            const predkosc = e.speed ? (e.speed * 3.6).toFixed(1) : obliczPredkosc(nowaPozycja);
            document.getElementById('predkosc').textContent = predkosc;
            document.getElementById('dystans').textContent = (dystansPrzebyta / 1000).toFixed(2);

            if (krokiPunkty.length > 0) {
                const krok = krokiPunkty[0];
                const odleglosc = nowaPozycja.distanceTo(krok.latlng);

                document.getElementById('instrukcja-box').textContent = `➡️ ${krok.instrukcja}`;
                document.getElementById('dystans-pozostal').textContent = `Za ${Math.round(odleglosc)}m`;

                if (odleglosc < 30 && !kierunkowskazAktywny) {
                    aktualizujKierunkowskazy(krok.instrukcja);
                }

                if (odleglosc < 15) {
                    krokiPunkty.shift();
                    kierunkowskazAktywny = false;
                    if (krokiPunkty.length > 0) {
                        document.getElementById('instrukcja-box').textContent =
                            `➡️ ${krokiPunkty[0].instrukcja}`;
                    } else {
                        document.getElementById('instrukcja-box').textContent = 'Idź prosto do celu';
                    }
                }
            }

            if (celPozycja && nowaPozycja.distanceTo(celPozycja) < 20) {
                zakonczTrase();
            }

            mojaPozycja = nowaPozycja;
        }

        function obliczPredkosc(nowaPozycja) {
            const teraz = Date.now();
            if (ostatniaPozycjaGPS && ostatniCzasGPS) {
                const d = ostatniaPozycjaGPS.distanceTo(nowaPozycja);
                const t = (teraz - ostatniCzasGPS) / 1000;
                ostatniaPozycjaGPS = nowaPozycja;
                ostatniCzasGPS = teraz;
                return (d / t * 3.6).toFixed(1);
            }
            ostatniaPozycjaGPS = nowaPozycja;
            ostatniCzasGPS = teraz;
            return '0.0';
        }

        function zatrzymaj() {
            czyDziala = false;
            clearInterval(timerInterval);
            map.stopLocate();
            liniaUkonczona = null;
            kierunkowskazAktywny = false;
            wylaczObie();
            const btn = document.getElementById('btnStart');
            btn.textContent = '▶ Start';
            btn.classList.remove('stop');
            document.getElementById('btnZakoncz').style.display = 'none';
        }

        function zakonczTrase() {
            if (!confirm('Zakończyć trasę i zapisać wynik?')) return;
            zatrzymaj();

            let procent = 100;
            if (aktywnaTrasa && aktywnaTrasa.dystans) {
                const planowany = parseFloat(aktywnaTrasa.dystans);
                const przebyta = dystansPrzebyta / 1000;
                procent = Math.min(100, Math.round((przebyta / planowany) * 100));
            }

            const sekundy = Math.floor((Date.now() - startTime) / 1000);
            const sredniaPredkosc = dystansPrzebyta > 0
                ? ((dystansPrzebyta / 1000) / (sekundy / 3600)).toFixed(1)
                : '0.0';

            const wynik = {
                data: new Date().toLocaleDateString('pl-PL'),
                godzina: new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'}),
                czas: document.getElementById('czas').textContent,
                dystans: (dystansPrzebyta / 1000).toFixed(2),
                predkosc: sredniaPredkosc,
                trasa: trasaWspolrzedne,
                waypointy: waypointy,
                nazwa: aktywnaTrasa ? aktywnaTrasa.nazwa : 'Trasa własna',
                procent: procent
            };

            const wyniki = JSON.parse(localStorage.getItem('wyniki') || '[]');
            wyniki.unshift(wynik);
            localStorage.setItem('wyniki', JSON.stringify(wyniki));

            alert(`Zapisano!\n${wynik.nazwa}\n${wynik.dystans} km (${procent}% trasy)\n${wynik.czas}`);
            window.location.href = 'menu.html';
        }

        function dodajWaypoint(typ) {
            if (!mojaPozycja) return;
            const kolor = typ === 'tak' ? '#2d6a2d' : '#7B1F1F';

            L.circleMarker(mojaPozycja, {
                radius: 10, fillColor: kolor,
                color: 'white', weight: 2, fillOpacity: 0.9
            }).addTo(map).bindPopup(
                `${typ === 'tak' ? 'TAK' : 'NIE'} · ${new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'})}`
            );

            waypointy.push({
                typ: typ,
                pozycja: mojaPozycja,
                czas: new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute:'2-digit'})
            });
        }

        // BLE
        async function polaczBLEnav(strona) {
            await polaczRaczke(strona);
            aktualizujBtnsNav();
        }

        function aktualizujBtnsNav() {
            const lewa = document.getElementById('btn-lewa-nav');
            const prawa = document.getElementById('btn-prawa-nav');
            if (lewa) lewa.classList.toggle('polaczony', czyPolaczenoLeft());
            if (prawa) prawa.classList.toggle('polaczony', czyPolaczenoRight());
        }

        async function testKierunkowskazow() {
            document.getElementById('instrukcja-box').textContent = 'Test: lewa rączka...';
            await kierunkowskazLewo(true);
            setTimeout(async () => {
                await kierunkowskazLewo(false);
                document.getElementById('instrukcja-box').textContent = 'Test: prawa rączka...';
                await kierunkowskazPrawo(true);
                setTimeout(async () => {
                    await kierunkowskazPrawo(false);
                    document.getElementById('instrukcja-box').textContent = 'Test zakończony!';
                }, 4000);
            }, 4000);
        }
    </script>
</body>
</html>
